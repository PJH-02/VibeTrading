# One instrument policy. Add manually managed stocks/ETFs/tokenized securities
# here. Expiring and top-N universes are resolved dynamically below.
instruments:
  - symbol: "069500"
    asset_class: etf
    providers: [kiwoom]
    underlying: KOSPI200
  - symbol: "229200"
    asset_class: etf
    providers: [kiwoom]
    underlying: KOSDAQ150
  # Toss uses an explicit market prefix for US symbols.
  - symbol: "US:SPY"
    asset_class: etf
    providers: [toss]
    market: US
    proxy_for: NASDAQ

  # Add ordinary stocks, ETFs, or Hyperliquid tokenized securities here.
  - symbol: "005930"
    asset_class: equity
    providers: [kiwoom, toss]
  - symbol: "000660"
    asset_class: equity
    providers: [kiwoom, toss]
  - symbol: "SKHYNIX-USDC"
    asset_class: tokenized_equity
    security_kind: tokenized_equity
    underlying: "SKHYNIX"
    currency: "USDC"
    exchange: "HYPERLIQUID"
    providers: [hyperliquid]

dynamic:
  kis_index_derivatives:
    underlyings: [KOSPI200, KOSDAQ150]
    option_expiries: 2
    strikes_each_side: 1
  kis_commodity_futures: [B10, USD]
  kis_overseas_futures: [NQ]
