# Optional, read-only LS process. Do not start until entitlement and fee checks
# have been recorded and the matching image containing ls_market.py is built.
services:
  ls-collectors:
    profiles: ["ls-market"]
    image: vibetrading-app:latest
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}"]
    command: ["python", "-m", "runtime.cli", "run", "--config", "/app/config/ls_market_runtime.yaml", "--role", "ls-collectors"]
    environment:
      NATS_URL: nats://nats:4222
      VIBETRADING_DATA_ROOT: /data
      VIBETRADING_LOG_DIR: /tmp/logs
    volumes:
      - "${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data"
      - "./config/ls_market_runtime.yaml:/app/config/ls_market_runtime.yaml:ro"
    mem_limit: 256m
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "python", "-m", "runtime.cli", "health-check", "--component", "ls-collectors", "--max-age-seconds", "120"]
      interval: 30s
      timeout: 10s
      retries: 4
