services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports: ["127.0.0.1:8222:8222"]
    volumes: ["${VIBETRADING_HOST_NATS_ROOT:?set in compose.env}:/data", "./deploy/nats.conf:/etc/nats/nats.conf:ro"]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: &logging
      driver: local
      options: {max-size: 10m, max-file: "3"}
  nats-init:
    image: ${VIBETRADING_APP_IMAGE:?run scripts/build_release_images.py first}
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}", "${VIBETRADING_APP_RELEASE_ENV_FILE:-deploy/app-release.env}"]
    command: ["python", "main.py", "nats-init"]
    environment: {NATS_URL: "nats://nats:4222", VIBETRADING_DATA_ROOT: /data}
    volumes: ["${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data", "./config:/app/config:ro"]
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    logging: *logging
  collectors:
    image: ${VIBETRADING_APP_IMAGE:?run scripts/build_release_images.py first}
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}", "${VIBETRADING_APP_RELEASE_ENV_FILE:-deploy/app-release.env}"]
    command: ["python", "main.py", "run", "--config", "/app/config/runtime.yaml", "--role", "collectors"]
    environment: {NATS_URL: "nats://nats:4222", VIBETRADING_DATA_ROOT: /data, VIBETRADING_LOG_DIR: /tmp/logs, NATS_FILE_STORE_MAX_BYTES: "2415919104"}
    volumes: ["${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data", "./config:/app/config:ro"]
    depends_on:
      nats-init:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "main.py", "health-check", "--component", "collectors", "--max-age-seconds", "120"]
      interval: 30s
      timeout: 10s
      retries: 4
    logging: *logging
  crypto-collectors:
    profiles: ["crypto"]
    image: ${VIBETRADING_APP_IMAGE:?run scripts/build_release_images.py first}
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}", "${VIBETRADING_APP_RELEASE_ENV_FILE:-deploy/app-release.env}"]
    command: ["python", "main.py", "run", "--config", "/app/config/crypto_runtime.yaml", "--role", "crypto-collectors"]
    environment: {NATS_URL: "nats://nats:4222", VIBETRADING_DATA_ROOT: /data, VIBETRADING_LOG_DIR: /tmp/logs, ARCHIVE_WORKER_ENABLED: "true", CRYPTO_NATS_MAX_BYTES: "134217728", NATS_FILE_STORE_MAX_BYTES: "2415919104"}
    volumes: ["${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data", "./config:/app/config:ro"]
    depends_on:
      nats-init:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "main.py", "health-check", "--component", "crypto-collectors", "--max-age-seconds", "120"]
      interval: 30s
      timeout: 10s
      retries: 4
    logging: *logging
  crypto-storage:
    profiles: ["crypto"]
    image: ${VIBETRADING_APP_IMAGE:?run scripts/build_release_images.py first}
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}", "${VIBETRADING_APP_RELEASE_ENV_FILE:-deploy/app-release.env}"]
    command: ["python", "main.py", "run", "--role", "crypto-storage"]
    environment: {NATS_URL: "nats://nats:4222", VIBETRADING_DATA_ROOT: /data, VIBETRADING_STATE_DIR: /data/crypto_state, PARQUET_DATA_ROOT: /data/crypto_market_data, VIBETRADING_LOG_DIR: /tmp/logs, ARCHIVE_WORKER_ENABLED: "true", CRYPTO_NATS_MAX_BYTES: "134217728", NATS_FILE_STORE_MAX_BYTES: "2415919104", STORAGE_MAX_PENDING_BEFORE_FLUSH: "16384", STORAGE_FLUSH_BUFFER_BYTES: "67108864", STORAGE_FLUSH_SECONDS: "60"}
    volumes: ["${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data"]
    depends_on:
      nats-init:
        condition: service_completed_successfully
    mem_limit: 1024m
    stop_grace_period: 90s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "main.py", "health-check", "--component", "crypto-storage", "--max-age-seconds", "120"]
      interval: 30s
      timeout: 10s
      retries: 4
    logging: *logging
  crypto-strategies:
    profiles: ["crypto-strategies"]
    image: ${VIBETRADING_APP_IMAGE:?run scripts/build_release_images.py first}
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}", "${VIBETRADING_APP_RELEASE_ENV_FILE:-deploy/app-release.env}"]
    command: ["python", "main.py", "run", "--config", "/app/config/crypto_runtime.yaml", "--role", "crypto-strategies"]
    environment: {NATS_URL: "nats://nats:4222", VIBETRADING_DATA_ROOT: /data, VIBETRADING_LOG_DIR: /tmp/logs}
    volumes: ["${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data", "./config:/app/config:ro"]
    depends_on:
      nats-init:
        condition: service_completed_successfully
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging
  crypto-maintenance:
    profiles: ["crypto"]
    image: ${VIBETRADING_APP_IMAGE:?run scripts/build_release_images.py first}
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}", "${VIBETRADING_APP_RELEASE_ENV_FILE:-deploy/app-release.env}"]
    command: ["python", "main.py", "run", "--role", "crypto-maintenance"]
    environment: {NATS_URL: "nats://nats:4222", VIBETRADING_DATA_ROOT: /data, VIBETRADING_STATE_DIR: /data/crypto_state, PARQUET_DATA_ROOT: /data/crypto_market_data, ARCHIVE_PREFIX: "vibetrading/crypto", ARCHIVE_LOCAL_RETENTION_SECONDS: "7200", ARCHIVE_UPLOAD_AFTER_SECONDS: "300", ARCHIVE_UPLOAD_BATCH: "128", ARCHIVE_SQLITE_BACKUP_INTERVAL_SECONDS: "86400", NATS_FILE_STORE_MAX_BYTES: "2415919104", COMPACTOR_JOBS_PER_CYCLE: "1", VIBETRADING_LOG_DIR: /tmp/logs, ARROW_NUM_THREADS: "1", OMP_NUM_THREADS: "1", ARCHIVE_WORKER_ENABLED: "true", ARCHIVE_ACCESS_KEY_FILE: /run/secrets/archive_access_key, ARCHIVE_SECRET_KEY_FILE: /run/secrets/archive_secret_key}
    volumes: ["${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data"]
    secrets: [archive_access_key, archive_secret_key]
    depends_on: {}
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging
  storage:
    image: ${VIBETRADING_APP_IMAGE:?run scripts/build_release_images.py first}
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}", "${VIBETRADING_APP_RELEASE_ENV_FILE:-deploy/app-release.env}"]
    command: ["python", "main.py", "run", "--role", "storage"]
    environment: {NATS_URL: "nats://nats:4222", VIBETRADING_DATA_ROOT: /data, VIBETRADING_LOG_DIR: /tmp/logs, NATS_FILE_STORE_MAX_BYTES: "2415919104", SQLITE_CACHE_KIB: "131072"}
    volumes: ["${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data"]
    depends_on:
      nats-init:
        condition: service_completed_successfully
    mem_limit: 1024m
    stop_grace_period: 90s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "main.py", "health-check", "--component", "storage", "--max-age-seconds", "120"]
      interval: 30s
      timeout: 10s
      retries: 4
    logging: *logging
  maintenance:
    image: ${VIBETRADING_APP_IMAGE:?run scripts/build_release_images.py first}
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}", "${VIBETRADING_APP_RELEASE_ENV_FILE:-deploy/app-release.env}"]
    command: ["python", "main.py", "run", "--role", "maintenance"]
    environment: {NATS_URL: "nats://nats:4222", VIBETRADING_DATA_ROOT: /data, VIBETRADING_LOG_DIR: /tmp/logs, ARROW_NUM_THREADS: "1", OMP_NUM_THREADS: "1", ARCHIVE_SQLITE_BACKUP_INTERVAL_SECONDS: "86400", NATS_FILE_STORE_MAX_BYTES: "2415919104", ARCHIVE_WORKER_ENABLED: "true", ARCHIVE_ACCESS_KEY_FILE: /run/secrets/archive_access_key, ARCHIVE_SECRET_KEY_FILE: /run/secrets/archive_secret_key}
    volumes: ["${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data"]
    secrets: [archive_access_key, archive_secret_key]
    depends_on: {}
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "main.py", "health-check", "--component", "maintenance", "--max-age-seconds", "420"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *logging
  telegram:
    image: ${VIBETRADING_APP_IMAGE:?run scripts/build_release_images.py first}
    env_file: ["${VIBETRADING_APP_ENV_FILE:-.env}", "${VIBETRADING_APP_RELEASE_ENV_FILE:-deploy/app-release.env}"]
    command: ["python", "main.py", "telegram"]
    environment: {NATS_URL: "nats://nats:4222", VIBETRADING_DATA_ROOT: /data, VIBETRADING_LOG_DIR: /tmp/logs, ARCHIVE_WORKER_ENABLED: "true"}
    volumes: ["${VIBETRADING_HOST_DATA_ROOT:?set in compose.env}:/data", "./vibetrading/telegram.py:/app/vibetrading/telegram.py:ro"]
    depends_on: {}
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging
secrets:
  archive_access_key: {file: "${ARCHIVE_ACCESS_KEY_FILE:?set in compose.env}"}
  archive_secret_key: {file: "${ARCHIVE_SECRET_KEY_FILE:?set in compose.env}"}
