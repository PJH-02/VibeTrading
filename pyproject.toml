# Distribution metadata for the canonical src domain packages.
# Runtime dependencies stay authoritative in requirements.txt and are only
# referenced dynamically here (they must not be duplicated or changed).

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetrading"
version = "0.0.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Only the ten canonical domains ship. Historical test oracles live in docs/archive.
[tool.setuptools.packages.find]
where = ["src"]
include = [
    "strategies",
    "strategies.*",
    "core",
    "core.*",
    "feeds",
    "feeds.*",
    "market",
    "market.*",
    "storage",
    "storage.*",
    "execution",
    "execution.*",
    "portfolio",
    "portfolio.*",
    "operations",
    "operations.*",
    "timefolio",
    "timefolio.*",
    "runtime",
    "runtime.*",
]
exclude = [
    "src",
    "src.*",
    "tests",
    "tests.*",
    "docs",
    "docs.*",
    "tmp",
    "tmp.*",
    "cache",
    "cache.*",
]
