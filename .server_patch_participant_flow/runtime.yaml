# Long-lived read-only market-data jobs. Credentials are loaded from .env.
collectors:
  # One coordinated KIS job prevents independent commodity/option sessions
  # from racing each other's subscription registrations.
  - provider: kis
    symbols: "auto:all"
  # Separate from KIS WebSockets so a socket reconnect never interrupts the
  # one-minute, rate-limited investor-flow REST schedule.
  - provider: kis-flow
    symbols: "@configured"
  - provider: kiwoom
    symbols: "@universe"
  - provider: toss
    symbols: "@universe"
  - provider: hyperliquid
    symbols: "@universe"
  - provider: binance
    symbols: "@universe"
strategies: []
