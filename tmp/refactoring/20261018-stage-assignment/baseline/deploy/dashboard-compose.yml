name: vibetrading-monitor
services:
  bridge:
    image: ${DASHBOARD_APP_IMAGE:?set app image}
    command: ["python", "-m", "vibetrading.dashboard.bridge"]
    env_file: ["/root/vibetrading/.env", "/etc/vibetrading/dashboard.env"]
    environment:
      NATS_URL: nats://nats:4222
      DASHBOARD_CRYPTO_VENUES: binance,grvt,arcus
      DASHBOARD_DATA_ROOT: /data
      DASHBOARD_MONITOR_ROOT: /monitor
      DASHBOARD_MM_ROOT: /pilot
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /srv/vibetrading-data/runtime_data:/data:ro
      - /opt/vibetrading/dashboard/monitor:/monitor
      - /opt/vibetrading/dashboard/vibetrading/dashboard:/app/vibetrading/dashboard:ro
      - /root/vibetrading/runtime_data/liquidity_mm:/pilot:ro
    networks: [pipeline]
    mem_limit: 192m
    cpus: 0.5
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/monitor/health.json')); assert time.time()*1000-s['updated_ms']<60000"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 2m, max-file: "2"}}
  timefolio:
    image: vibetrading-dashboard-timefolio:20261004
    command: ["python", "-m", "vibetrading.dashboard.timefolio_monitor"]
    env_file: ["/root/vibetrading/.env", "/etc/vibetrading/dashboard.env"]
    environment:
      DASHBOARD_MONITOR_ROOT: /monitor
      PLAYWRIGHT_BROWSERS_PATH: /opt/dashboard-browsers
      VIBETRADING_DATA_ROOT: /tmp/dashboard
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /opt/vibetrading/dashboard/monitor:/monitor
      - /opt/vibetrading/dashboard/vibetrading/dashboard:/app/vibetrading/dashboard:ro
    shm_size: 64m
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 2m, max-file: "2"}}
networks:
  pipeline:
    external: true
    name: vibetrading_default
