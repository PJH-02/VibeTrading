    GetRequestPayload:
      type: object
      required:
        - type
        - id
        - request
      properties:
        type:
          type: string
          const: get
        id:
          type: integer
          description: Client-chosen request id, echoed in the response.
          example: 2
        request:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - l2orderbook
                - bbo
                - mids
                - account
                - fills
                - orders
                - markets
                - prices
                - positions
                - leverages
                - ratelimit
              description: RPC method name.
            payload:
              type: object
              additionalProperties: true
              description: |
                Method-specific parameters. `market` required for market-scoped RPCs.

                An optional `market` filter is accepted by every market-scoped read: `fills`, `orders`, `positions`, `leverages`, `mids`, and `prices`. It takes either the display ticker (`BTC-USD`, case-insensitive) or the numeric market id (`1`), resolved by the same code as the REST `?market=` query param. Omit it to get every market; an unresolvable value returns 400 rather than a silent all-markets response. On `mids` and `prices` a filter naming an OFFLINE market returns an empty object, matching how the unfiltered response omits offline markets.

                Account-scoped list RPCs take the same filters as their REST equivalents: `orders` accepts `market` and `status`, `fills` accepts `market` and `role`. On `orders`, both filters apply to the `openOrders` and `recentClosedOrders` halves of the result, and `status` accepts either a JSON array (`["OPEN","CANCELED"]`) or a comma-separated string (`"OPEN,CANCELED"`) — the same two spellings as the REST `?status=` param. Values are `OPEN`, `UNTRIGGERED`, `FILLED`, `CANCELED`, `REJECTED`, `LIQUIDATED`, `ADL`, case-insensitive; an unrecognised value returns 400. `status` matches each order's current status, not any status it held earlier in its life.
              example:
                market: BTC-USD
              properties: {}
    RpcResponsePayload:
      type: object
      required:
        - method
        - id
        - status
      properties:
        method:
          type: string
          description: Echoed from `request.type`.
        id:
          type: integer
          description: Echoed from the request `id`.
        status:
          type: integer
          description: |
            HTTP-like status. 200 = success with a definitive engine ack, 202 = accepted (not terminal — observe `orders`/`userFills` for the lifecycle), 4xx = client error, 5xx = gateway error.
          enum:
            - 200
            - 202
            - 400
            - 401
            - 403
            - 404
            - 409
            - 429
            - 500
            - 501
            - 503
        result:
          type: object
          additionalProperties: true
          description: Present on success.
          properties: {}
        error:
          type: object
          description: Present on failure.
          properties:
            type:
              type: string
            message:
              type: string
            field:
              type: string
              description: Field that caused the error, if applicable.
            errorType:
              type: string
              description: Machine-readable error code.
            errorSource:
              type: string
              description: Which layer surfaced the error.
            retryAfterMs:
              type: integer
              format: int64
              minimum: 0
              description: |
                Present only on 429 (rate-limit) errors. Precise milliseconds the client should wait before retrying. Mirrors the REST 429 body's `retryAfterMs` field.
