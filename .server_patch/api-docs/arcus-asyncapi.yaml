    PlaceOrderRequest:
      name: PlaceOrderRequest
      title: Place Order
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlaceOrderPayload'
      examples:
        - name: Place a GTT limit buy
          payload:
