                  globalSequenceId: 9600000001
                  accountSequenceNum: 42
    AccountTransferUpdateEvent:
      name: AccountTransferUpdateEvent
      title: Account Transfer Update
      contentType: application/json
      description: |
        A single applied transfer event (`isSnapshot: false`, one entry in `accountTransferEvents`), emitted as each deposit / withdrawal / transfer is applied by the engine.
      payload:
        $ref: '#/components/schemas/AccountTransferUpdatesPayload'
      examples:
        - name: Withdrawal applied
          payload:
            type: channel_data
            channel: accountTransferUpdates
