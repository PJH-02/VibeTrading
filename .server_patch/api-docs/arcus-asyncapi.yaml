                marketId: 1
                orderSide: BUY
                orderType: LIMIT
                timeInForce: GTT
                goodTilTime: '4102444800000000'
                quantity: '0.01'
                price: '50000'
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
              signature: <128-hex-signature>
    CancelOrderRequest:
      name: CancelOrderRequest
      title: Cancel Order
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CancelOrderPayload'
      examples:
        - name: Cancel by orderId
          payload:
            type: post
            id: 43
            request:
              type: cancelOrder
              payload:
                address: 0x...
                accountIndex: 0
                marketId: 1
                orderId: ord-abc123
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
              signature: <128-hex-signature>
    ModifyOrderRequest:
      name: ModifyOrderRequest
      title: Modify Order
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ModifyOrderPayload'
      examples:
        - name: Modify price and quantity
          payload:
            type: post
            id: 5
            request:
              type: modifyOrder
              payload:
                address: 0x...
                accountIndex: 0
                marketId: 1
                orderId: ord-abc123
                side: BUY
                quantity: '0.02'
