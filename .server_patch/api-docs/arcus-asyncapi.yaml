              signature: <128-hex-signature>
    SetLeverageRequest:
      name: SetLeverageRequest
      title: Set Leverage
      contentType: application/json
      description: |
        Per-`(account, market)` leverage. Mirrors `POST /v1/setLeverage`. `leverage` is an integer in `[1, market max]`; values outside this range are rejected with `400`. The WS path returns immediately on accept (envelope `status: 202`, body `status: ACK`); subscribe to the `accountAttributes` channel to observe the engine-confirmed outcome: an APPLIED change arrives as a `leverage` entry, a REJECTED one as a `leverageReject` entry (carrying the same `requestId` for correlation).
      payload:
        $ref: '#/components/schemas/SetLeveragePayload'
      examples:
        - name: Set BTC-USD leverage to 5x
          payload:
            type: post
            id: 7
            request:
              type: setLeverage
              payload:
                address: 0x...
                accountIndex: 0
                marketId: 1
                leverage: 5
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
              signature: <128-hex-signature>
    AdjustIsolatedMarginRequest:
      name: AdjustIsolatedMarginRequest
      title: Adjust Isolated Margin
      contentType: application/json
      description: |
        Move margin between the cross bucket and an isolated-mode position's leg for `(account, market)`. Mirrors `POST /v1/adjustIsolatedMargin`. `amount` is dollars as a decimal string (e.g. `"100"` for $100) — do not send quote quantums; the gateway converts dollars to quantums for the engine. Positive adds to the leg (cross → isolated), negative removes from the leg (isolated → cross), zero is rejected with `400`. The WS path returns immediately on accept (envelope `status: 202`, body `status: ACK`); the engine-confirmed post-state arrives on the `positions` channel as a `PositionUpdate` (correlated by `requestId`).
      payload:
        $ref: '#/components/schemas/AdjustIsolatedMarginPayload'
      examples:
        - name: Add 100 USDC of margin to BTC-USD isolated leg
          payload:
            type: post
            id: 8
            request:
              type: adjustIsolatedMargin
              payload:
                address: 0x...
                accountIndex: 0
                marketId: 1
                amount: '100'
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
              signature: <128-hex-signature>
    CancelAllOrdersRequest:
      name: CancelAllOrdersRequest
      title: Cancel All Orders
      contentType: application/json
      description: |
        Cancels every open order for `(address, accountIndex)`. Pass `marketId` to scope the cancel to a single market; omit it to cancel across all markets. Untriggered TPSL orders in scope are canceled too. Mirrors `POST /v1/cancelAllOrders`.
      payload:
        $ref: '#/components/schemas/CancelAllOrdersPayload'
      examples:
        - name: Cancel all on BTC-USD
          payload:
            type: post
            id: 44
            request:
              type: cancelAllOrders
              payload:
                address: 0x...
                accountIndex: 0
                marketId: 1
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
              signature: <128-hex-signature>
    ScheduleCancelRequest:
      name: ScheduleCancelRequest
      title: Schedule Cancel
      contentType: application/json
      description: |
        Dead man's switch. Arm, refresh, or disarm a cancel-all deadline. Mirrors `POST /v1/scheduleCancel`.

        Keep the switch armed by sending a **new** `time` (updated absolute epoch microseconds, 5s–5min ahead of now — typically `now + 60s`) before the current deadline. Reusing a past `time` does not extend the previous arm. Omit `time` (or send null) to disarm. If the deadline elapses without a refresh, the gateway fires `cancelAllOrders`.

        Omit `marketId` for an account-wide switch (fires cancel-all across every market), or set it to scope the switch to a single market. A per-market switch is independent of the account-wide switch and of other per-market switches on the same subaccount, and `marketId` selects which switch a given arm/refresh/disarm targets.

        A wallet may hold only a bounded number of switches armed at once (across all subaccounts and markets); arming a new switch beyond that limit is rejected. Refreshing an already-armed switch is always allowed.
      payload:
        $ref: '#/components/schemas/ScheduleCancelPayload'
      examples:
        - name: Arm 60s deadline
          payload:
            type: post
            id: 46
            request:
              type: scheduleCancel
              payload:
                address: 0x...
                accountIndex: 0
                time: 1734567890123000
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
              signature: <128-hex-signature>
        - name: Arm per-market switch (market 0) with 60s deadline
          payload:
            type: post
            id: 49
            request:
              type: scheduleCancel
              payload:
                address: 0x...
                accountIndex: 0
                marketId: 0
                time: 1734567890123000
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
              signature: <128-hex-signature>
        - name: Refresh with a later deadline
          payload:
            type: post
            id: 47
            request:
              type: scheduleCancel
              payload:
                address: 0x...
                accountIndex: 0
                time: 1734567950123000
              apiKey: <64-hex-public-key>
              timestamp: '1712345708000000000'
              signature: <128-hex-signature>
        - name: Disarm
          payload:
            type: post
            id: 48
            request:
              type: scheduleCancel
              payload:
                address: 0x...
                accountIndex: 0
              apiKey: <64-hex-public-key>
              timestamp: '1712345738000000000'
              signature: <128-hex-signature>
    BatchPlaceOrdersRequest:
      name: BatchPlaceOrdersRequest
      title: Batch Place Orders
      contentType: application/json
      description: |
        Places up to 100 orders in one request. All orders must share the same `address` / `accountIndex`. Signed PER ELEMENT using the typed canonical payload: each element of `orders` carries its own `signature` over the same typed `placeOrder` payload the element would carry if submitted standalone (op=1 for regular orders, op=4 for TPSL legs). The `request` envelope carries only the shared `apiKey` + `timestamp`; there is no outer `request.signature`. Mirrors `POST /v1/batchPlaceOrders`.
      payload:
        $ref: '#/components/schemas/BatchPlaceOrdersPayload'
      examples:
        - name: Place two limit orders
          payload:
            type: post
            id: 45
            request:
              type: batchPlaceOrders
              payload:
                orders:
                  - address: 0x...
                    accountIndex: 0
                    marketId: 1
                    orderSide: BUY
                    orderType: LIMIT
                    timeInForce: GTT
                    goodTilTime: '4102444800000000'
                    quantity: '0.1'
                    price: '49000'
                    clientId: bid-1
                    signature: <128-hex signature for this order>
                  - address: 0x...
                    accountIndex: 0
                    marketId: 1
                    orderSide: SELL
                    orderType: LIMIT
                    timeInForce: GTT
                    goodTilTime: '4102444800000000'
                    quantity: '0.1'
                    price: '51000'
                    clientId: ask-1
                    signature: <128-hex signature for this order>
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
    BatchCancelOrdersRequest:
      name: BatchCancelOrdersRequest
      title: Batch Cancel Orders
      contentType: application/json
      description: |
        Cancels up to 100 orders in one request. All cancels must share the same `address` / `accountIndex`. Signed PER ELEMENT using the typed canonical payload: each element of `cancels` carries its own `signature` over the same typed `cancelOrder` payload the element would carry if submitted standalone. The `request` envelope carries only the shared `apiKey` + `timestamp`; there is no outer `request.signature`. Mirrors `POST /v1/batchCancelOrders`.
      payload:
        $ref: '#/components/schemas/BatchCancelOrdersPayload'
      examples:
        - name: Cancel by orderId and clientId
          payload:
            type: post
            id: 46
            request:
              type: batchCancelOrders
              payload:
                cancels:
                  - address: 0x...
                    accountIndex: 0
                    marketId: 1
                    orderId: ord-abc123
                    signature: <128-hex signature for this cancel>
                  - address: 0x...
                    accountIndex: 0
                    marketId: 1
                    clientId: bid-1
                    signature: <128-hex signature for this cancel>
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
    BatchModifyOrdersRequest:
      name: BatchModifyOrdersRequest
      title: Batch Modify Orders
      contentType: application/json
      description: |
        Modifies up to 100 resting orders in one request. All modifies must share the same `address` / `accountIndex`. Signed PER ELEMENT using the typed canonical payload: each element of `modifies` carries its own `signature` over the same typed `modifyOrder` payload the element would carry if submitted standalone (op=3). The `request` envelope carries only the shared `apiKey` + `timestamp`; there is no outer `request.signature`. Failures are per element — an element that fails validation or signature verification surfaces as a `status: ERROR` row in the response while the rest of the batch proceeds. Mirrors `POST /v1/batchModifyOrders`.
      payload:
        $ref: '#/components/schemas/BatchModifyOrdersPayload'
      examples:
        - name: Reprice two resting orders
          payload:
            type: post
            id: 47
            request:
              type: batchModifyOrders
              payload:
                modifies:
                  - address: 0x...
                    accountIndex: 0
                    marketId: 1
                    orderId: ord-abc123
                    side: BUY
                    quantity: '0.1'
                    price: '49100'
                    timeInForce: GTT
                    goodTilTime: '4102444800000000'
                    reduceOnly: false
                    signature: <128-hex signature for this modify>
                  - address: 0x...
                    accountIndex: 0
                    marketId: 1
                    orderId: ord-def456
                    side: SELL
                    quantity: '0.1'
                    price: '50900'
                    timeInForce: GTT
                    goodTilTime: '4102444800000000'
                    reduceOnly: false
                    signature: <128-hex signature for this modify>
              apiKey: <64-hex-public-key>
              timestamp: '1712345678000000000'
    GetRequest:
      name: GetRequest
      title: Get Snapshot (RPC)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/GetRequestPayload'
      examples:
        - name: Get L2 orderbook
          payload:
            type: get
            id: 2
            request:
              type: l2orderbook
              payload:
                market: BTC-USD
        - name: Get account snapshot
          payload:
            type: get
            id: 3
            request:
              type: account
    RpcResponse:
      name: RpcResponse
      title: RPC Response
      contentType: application/json
      description: |
        Response to a `post` or `get` request. `id` is always echoed from the request. Order mutations reply with `status: 202` (accepted, not terminal). Other methods reply with `status: 200` on success.
      payload:
        $ref: '#/components/schemas/RpcResponsePayload'
      examples:
        - name: Order accepted (202)
          payload:
            method: placeOrder
            id: 1
            status: 202
            result:
              orderId: ord-abc123
              status: ACK
        - name: RPC success (200)
          payload:
            method: l2orderbook
            id: 2
            status: 200
            result:
              bids:
                - - '94500.0'
                  - '1.5'
              asks:
                - - '94501.0'
                  - '0.8'
        - name: Error response
          payload:
            method: placeOrder
            id: 4
            status: 400
            error:
              type: VALIDATION_ERROR
              message: quantity must be positive
              field: quantity
  schemas:
    SubscribeL2OrderbookPayload:
      type: object
      required:
        - type
        - channel
        - id
      properties:
        type:
          type: string
          const: subscribe
        channel:
          type: string
          enum:
            - l2Orderbook
            - l2OrderbookUpdates
        id:
          type: string
          description: Market display name (e.g. "BTC-USD", "ETH-USD").
          example: BTC-USD
        nLevels:
          type: integer
          description: Price levels per side in snapshot. Range 1–100.
          default: 20
          minimum: 1
          maximum: 100
        sigFigs:
          type: integer
          description: 'Aggregate price levels to this many significant figures. Omit for full precision. Bids round down / asks round up to the bucket boundary and merged sizes are summed; applied before nLevels truncation. A second subscribe on the same market is allowed when this (with roundStep) differs from every view already held.

            '
          enum:
            - 2
            - 3
            - 4
            - 5
        roundStep:
          type: integer
          description: 'Refines the finest bucket into steps of 1, 2, or 5. Takes effect only when sigFigs is 5; ignored otherwise. Unsubscribe must echo the same value used to subscribe.

            '
          enum:
            - 1
            - 2
            - 5
    SubscribeL2OrderbookUpdatesPayload:
      type: object
      required:
        - type
        - channel
        - id
      properties:
        type:
          type: string
          const: subscribe
        channel:
          type: string
          const: l2OrderbookUpdates
        id:
          type: string
          description: Market display name (e.g. "BTC-USD", "ETH-USD").
          example: BTC-USD
        nLevels:
          type: integer
          description: Price levels per side in the initial snapshot. Range 1–100.
          default: 20
          minimum: 1
          maximum: 100
        snapshot:
          type: boolean
          description: When false, suppress the initial book snapshot on subscribe and stream only incremental delta updates. Defaults to true.
          default: true
    SubscribeByMarketPayload:
      type: object
      required:
        - type
        - channel
        - id
      properties:
        type:
          type: string
          const: subscribe
        channel:
          type: string
          enum:
            - trades
            - oraclePrices
            - bbo
        id:
          type: string
          description: Market display name (e.g. "BTC-USD").
          example: BTC-USD
    SubscribeByAddressPayload:
      type: object
      required:
        - type
        - channel
        - id
      properties:
        type:
          type: string
          const: subscribe
        channel:
          type: string
          enum:
            - account
            - positions
            - userFills
            - orders
            - funding
            - accountAttributeUpdates
        id:
          type: string
          description: 'Master Ethereum address (0x-prefixed) or an encoded internal account id. When an encoded id is used it already carries its own subaccount index; supplying `accountIndex` as well is allowed only if the two agree. Whichever spelling is sent, every response frame echoes the lowercase master address.

            '
          example: 0xAbCd...1234
        accountIndex:
          type: integer
          description: |
            Subaccount of the address in `id` to subscribe to. Honored on the account-scoped channels — `account`, `positions`, `orders`, `userFills`, `funding`, `accountTransferUpdates`, `accountAttributeUpdates`. Omit for subaccount 0, which is what every client written before this field existed gets. It is part of subscription identity: each subaccount is a separate subscription with its own snapshot and stream, so one connection may hold several, and `unsubscribe` must repeat the same `accountIndex` — omitting it drops only subaccount 0. Supplying it on a channel that is not account-scoped (e.g. `l2Orderbook`, `trades`, `markets`) is an error, NOT a silently ignored field, for the same reason `market` is: a client that believed its stream was scoped to one subaccount would mis-handle the rest. A value outside 0-9 is likewise an error rather than a clamp — an out-of-range subaccount can never carry traffic, so accepting one returns a permanently silent subscription.
          minimum: 0
          maximum: 9
          default: 0
          example: 3
        snapshot:
          type: boolean
          description: When false, suppress the initial state snapshot on subscribe and stream only live updates (e.g. userFills, orders). Defaults to true.
          default: true
        nFills:
          type: integer
          description: 'Optional userFills-only snapshot size (default 500, max 500). Honored only on the userFills channel; ignored elsewhere. Live channel_data frames are unaffected.

            '
          default: 500
          maximum: 500
          minimum: 1
        market:
          type: string
          example: BTC-USD
          description: |
            Restrict this subscription to a single market. Honored only on `positions`, `orders`, and `userFills` — the account-scoped channels whose every frame is about exactly one market. Supplying it on any other channel (e.g. `account`, `accountTransferUpdates`) is an error, NOT a silently ignored field: a client that believed its stream was scoped to one market would mishandle every other market's data. Accepts the display ticker ("BTC-USD", case-insensitive) or the numeric market id ("1"), the same spellings as the REST `?market=` query param. Omit for every market; an unresolvable value is an error rather than an unfiltered stream. The filter applies to the subscribe snapshot, the live `channel_data` frames, and the post-snapshot catch-up alike, so the baseline and the diffs always describe the same markets. It is part of subscription identity: one connection may hold several market-filtered views of the same channel + id, and `unsubscribe` must repeat the market it subscribed with (an `unsubscribe` with no `market` matches only the unfiltered view). The `subscribed` / `unsubscribed` acks echo the resolved ticker.
    SubscribeGlobalPayload:
      type: object
      required:
        - type
        - channel
      properties:
        type:
          type: string
          const: subscribe
        channel:
          type: string
          enum:
            - markets
            - exchangeAttributeUpdates
    SubscribeExchangeAttributeUpdatesPayload:
      type: object
      required:
        - type
        - channel
      properties:
        type:
          type: string
          const: subscribe
        channel:
          type: string
          const: exchangeAttributeUpdates
        snapshot:
          type: boolean
          description: When false, suppress the initial state snapshot on subscribe and stream only live updates. Defaults to true.
          default: true
    SubscribeMarketAttributesPayload:
      type: object
      required:
        - type
        - channel
      properties:
        type:
          type: string
          const: subscribe
        channel:
          type: string
          const: marketAttributes
        snapshot:
          type: boolean
          description: When false, suppress the initial per-market snapshot on subscribe and stream only live updates. Defaults to true.
          default: true
    SubscribeCandlesPayload:
      type: object
      required:
        - type
        - channel
        - id
      properties:
        type:
          type: string
          const: subscribe
        channel:
          type: string
          enum:
            - candles
        id:
          type: string
          description: |
            Market and timeframe joined with "/". Available timeframes: `1m`, `3m`, `5m`, `15m`, `30m`, `1h`, `2h`, `4h`, `8h`, `12h`, `1d`, `3d`, `1w`.
          example: BTC-USD/1m
          pattern: ^[A-Z]+-[A-Z]+\/(1m|3m|5m|15m|30m|1h|2h|4h|8h|12h|1d|3d|1w)$
        snapshot:
          type: boolean
          description: When false, suppress the initial candles snapshot on subscribe and stream only live updates. Defaults to true.
          default: true
    ChannelDataEnvelope:
      type: object
      description: Common envelope for all server-pushed channel messages.
      required:
        - type
        - channel
      properties:
        type:
          type: string
          enum:
            - subscribed
            - channel_data
          description: '`subscribed` for the initial snapshot; `channel_data` for updates.'
        channel:
          type: string
          description: Channel name.
        id:
          type: string
          description: 'Channel id (market, or the lowercase master Ethereum address on account-scoped channels). Absent for global channels. Always lowercase for addresses regardless of the spelling used to subscribe, so compare it case-insensitively.

            '
        accountIndex:
          type: integer
          description: |
            Subaccount this frame belongs to. Present on EVERY frame of an account-scoped channel — `subscribed`, `unsubscribed`, `degraded`, and `channel_data` alike — including when it is 0, so a frame names its subaccount outright and no client needs a "missing means 0" rule. Omitted on every other channel. This is what makes several subaccounts of one address demuxable on a single connection: `id` alone is the master address and is identical across all of them.
          minimum: 0
          maximum: 9
          example: 3
        sigFigs:
          type: integer
          description: 'Echo of the l2Orderbook aggregation this frame belongs to. Omitted on full-precision views and on every other channel. Lets a client holding several aggregations of the same market demux snapshots.

            '
          enum:
            - 2
            - 3
            - 4
            - 5
        roundStep:
          type: integer
          description: Echo of the l2Orderbook roundStep for this view. Omitted unless sigFigs is 5 and roundStep was 2 or 5.
          enum:
            - 1
            - 2
            - 5
        market:
          type: string
          example: BTC-USD
          description: |
            Display ticker of the market this frame belongs to, always the resolved ticker even when the client subscribed by numeric id. Present only on `positions` / `orders` / `userFills`; omitted on every other channel. Its meaning differs slightly by frame type. On `subscribed` / `unsubscribed` it echoes the market filter the subscription was created with, and is omitted for an unfiltered subscription. On `channel_data` it is the market of the frame itself, so an UNFILTERED subscriber sees it too — those channels emit one frame per market, so every frame has one. This is what lets a client demux, exactly as `sigFigs` / `roundStep` do for l2Orderbook: a connection holding several market-filtered views of one account matches each frame to the right view by this field. Clients that hold a single unfiltered view can ignore it.
        contents:
          type: object
          additionalProperties: true
          description: Channel-specific payload. Schema varies by channel.
          properties: {}
    DegradedNotice:
      type: object
      description: |
        Sent once when the initial snapshot for a subscribe cannot be served (too stale to join the live stream, or the backend read failed). The subscription stays pending; the server retries and completes it with a normal `subscribed` frame once a snapshot can be served.
      required:
        - type
        - channel
        - reason
      properties:
        type:
          type: string
          const: degraded
        channel:
          type: string
          description: Channel name.
        id:
          type: string
          description: 'Channel id (market, or the lowercase master Ethereum address on account-scoped channels). Absent for global channels.

            '
        accountIndex:
          type: integer
          description: 'Subaccount whose subscribe is degraded. Present on account-scoped channels — including when it is 0 — and omitted on every other channel, exactly as on `channel_data`. Each subaccount is its own subscription, so one can be degraded while another on the same address is already serving; without this field a client could not tell which of its pending subscribes the notice refers to.

            '
          minimum: 0
          maximum: 9
          example: 3
        reason:
          type: string
          enum:
            - snapshot_stale
            - snapshot_unavailable
        retryAfterMs:
          type: integer
          description: Advisory server-side retry cadence in milliseconds.
    L2OrderbookSnapshotPayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: subscribed
            contents:
              type: object
              required:
                - bids
                - asks
                - lastSequenceId
              properties:
                bids:
                  type: array
                  description: Price levels, best bid first. Each entry is `[price, size]`.
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: string
                  example:
                    - - '94500.0'
                      - '1.5'
                    - - '94499.0'
                      - '2.0'
                asks:
                  type: array
                  description: Price levels, best ask first. Each entry is `[price, size]`.
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: string
                  example:
                    - - '94501.0'
                      - '0.8'
                    - - '94502.0'
                      - '3.1'
                lastSequenceId:
                  type: integer
                  description: Per-market orderbook sequence of the last update reflected in this snapshot. Reconcile `l2OrderbookUpdates` deltas against this — apply deltas whose `lastSequenceId` exceeds it.
                  example: 1042
                globalSequenceId:
                  type: integer
                  description: Cross-market monotonic sequence. Omitted when zero.
                  example: 880421
                timestamp:
                  type: integer
                  format: int64
                  description: Unix microseconds when the snapshot was taken. Omitted when zero.
                  example: 1780410803123456
    L2OrderbookUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: channel_data
            contents:
              type: object
              description: |
                Incremental delta. Each `[price, size]` entry sets that level's absolute size; `size: "0"` means the level was removed. Apply every delta whose `lastSequenceId` exceeds the snapshot's; the first delta may be a few sequences ahead of the snapshot (an expected boundary gap that self-heals — do **not** re-subscribe on it). Once you are applying deltas, sequences are contiguous, so only a **mid-stream** gap means a missed delta — re-subscribe for a fresh snapshot then.
              required:
                - bids
                - asks
                - lastSequenceId
                - globalSequenceId
              properties:
                bids:
                  type: array
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: string
                asks:
                  type: array
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: string
                lastSequenceId:
                  type: integer
                  description: Per-market orderbook sequence for this delta. Monotonically increasing; the first delta after a snapshot may be a few sequences ahead of the snapshot's `lastSequenceId` (expected boundary gap). Apply any delta whose `lastSequenceId` exceeds the snapshot's; sequences are contiguous once you are applying deltas.
                globalSequenceId:
                  type: integer
                  description: Cross-market monotonic sequence.
    TradesUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: channel_data
            contents:
              type: array
              description: |
                Array of fills from one taker order match. All entries share `takerOrderId`, `takerAccountId`, `timestamp`, and `sequenceNumber`.
              items:
                type: object
                properties:
                  takerOrderId:
                    type: string
                  makerOrderId:
                    type: string
                  takerAddress:
                    type: string
                  makerAddress:
                    type: string
                  price:
                    type: string
                    example: '94500.00'
                  size:
                    type: string
                    example: '0.5'
                  tradeId:
                    type: string
                  timestamp:
                    type: integer
                    description: Unix timestamp in microseconds.
                  sequenceNumber:
                    type: integer
    MarketsUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            contents:
              type: object
              required:
                - isSnapshot
                - markets
              properties:
                isSnapshot:
                  type: boolean
                  description: |
                    Always `true` on this channel — every emission is a full snapshot, not a partial diff.
                  example: true
                markets:
                  type: object
                  description: |
                    All markets keyed by `marketId` as a string. Same per-market shape as REST `GET /v1/markets` (`MarketInfo`).
                  additionalProperties:
                    type: object
                    description: One market entry. Matches REST `MarketInfo`.
                    properties:
                      marketDisplayName:
                        type: string
                        example: BTC-USD
                      marketId:
                        type: integer
                        example: 1
                      status:
                        type: string
                        example: ONLINE
                      baseAsset:
                        type: string
                        example: BTC
                      quoteAsset:
                        type: string
                        example: USD
                      tickSize:
                        type: string
                      stepSize:
                        type: string
                      minOrderSize:
                        type: string
                        description: Minimum order quantity, in base-asset units.
                        example: '0.0001'
                      maxOrderSize:
                        type: string
                        description: |
                          Maximum order quantity, in base-asset units. A per-order security gate rather than a dust filter — reduce-only orders are NOT exempt.
                        example: '10000'
                      oraclePrice:
                        type: string
                        example: '94500.00'
                      markPrice:
                        type: string
                        description: 'Authoritative mark price (decimal string) — the sole risk-valuation price. "0" means unavailable; callers must not fall back to `oraclePrice`.

                          '
                        example: '94500.50'
                      lastTradePrice:
                        type: string
                        description: Price of the most recent trade (decimal string). Omitted until the market has traded.
                        example: '94498.00'
                      fundingRate:
                        type: string
                        description: Most recently applied funding rate.
                        example: '0.0001'
                      nextFundingRate:
                        type: string
                        description: In-progress forecast for the next funding payment.
                        example: '0.00012'
                      nextFundingAt:
                        type: integer
                        format: int64
                        description: Unix seconds for the next funding payment time.
                      priceChange24h:
                        type: string
                        description: Fractional change in the mark price (not the oracle price) over the trailing 24h (e.g. "0.025" = +2.5%), computed from a rolling per-market ring of the first mark price seen each minute.
                      volume24h:
                        type: string
                        description: Base-asset trade volume over the trailing 24h, from the rolling-24h aggregator.
                      high24h:
                        type: string
                        description: Highest transaction price over the trailing 24h, from closed 1m candles with at least one trade.
                      low24h:
                        type: string
                        description: Lowest transaction price over the trailing 24h, from closed 1m candles with at least one trade.
                      trades24h:
                        type: integer
                        format: int64
                        description: Trade count over the trailing 24h, from the rolling-24h aggregator.
                      openInterest:
                        type: string
                        description: Total size of all open long positions in the market (equals total short), in base asset units. Refreshed from a periodic snapshot, so it may lag real time.
                      openInterestCapNotional:
                        type: string
                        description: Operator-set maximum open interest as a USD-notional decimal string (openInterest × mark price). At the cap the engine rejects OI-increasing fills with rejection reason OPEN_INTEREST_CAP_EXCEEDED; OI-neutral and OI-reducing trades still match. `null` when no cap is active. Refreshed from a periodic snapshot, so it may lag real time.
                        example: '50000000'
                        nullable: true
                      initialMarginFraction:
                        type: string
                      maintenanceMarginFraction:
                        type: string
                      offHoursInitialMarginFraction:
                        type: string
                        description: Initial margin fraction the engine enforces outside `regularTradingHours` (overnight/weekends for equity-class markets); equals `initialMarginFraction` for 24/7 markets. Maintenance margin is not uplifted off-hours.
                      currentSettlementPrice:
                        type: string
                        description: Sealed VWAP settlement price (decimal USD) anchoring the off-hours trading band. Present only while outside RTH with a sealed anchor; omitted in-RTH and for 24/7 markets.
                      upperTradingBound:
                        type: string
                        description: Actual upper price boundary (decimal USD) of the off-hours trading band the engine enforces (anchor + anchor × initialMarginFraction × bandMultiplier; the multiplier walks the 0.5×→1×→2×→4× ladder independently per side). Fills at or above it are halted. Present only while outside RTH with a sealed anchor; omitted in-RTH and for 24/7 markets.
                      lowerTradingBound:
                        type: string
                        description: Actual lower price boundary (decimal USD) of the off-hours trading band. Fills at or below it are halted. Present only while outside RTH with a sealed anchor; omitted in-RTH and for 24/7 markets.
                      nextUpperTradingBound:
                        type: string
                        description: Price (decimal USD) the upper boundary moves to if the upper band expands one level; equals upperTradingBound at the 4× ceiling. Present only while outside RTH with a sealed anchor.
                      nextLowerTradingBound:
                        type: string
                        description: Price (decimal USD) the lower boundary moves to if the lower band expands one level; equals lowerTradingBound at the 4× ceiling. Present only while outside RTH with a sealed anchor.
                      isUpperInExpansionZone:
                        type: boolean
                        description: Whether the upper band side is in its expansion zone — the 1-hour EWMA of the bid-side impact price is holding within 90% of the upper boundary; holding for one continuous hour expands the band one level. The zones are independent per side. Present only while outside RTH with a sealed anchor.
                      isLowerInExpansionZone:
                        type: boolean
                        description: Whether the lower band side is in its expansion zone. Present only while outside RTH with a sealed anchor.
                      upperZoneEnteredAt:
                        type: integer
                        format: int64
                        description: Unix seconds at which the upper side entered its expansion zone. Present only while isUpperInExpansionZone is true.
                      upperExpectedExpansionAt:
                        type: integer
                        format: int64
                        description: Unix seconds of the earliest time the upper bound can expand — exactly one hour after upperZoneEnteredAt. Not a guarantee; the EWMA must still be in the zone when the hour completes. Present only while isUpperInExpansionZone is true.
                      lowerZoneEnteredAt:
                        type: integer
                        format: int64
                        description: Unix seconds at which the lower side entered its expansion zone. Present only while isLowerInExpansionZone is true.
                      lowerExpectedExpansionAt:
                        type: integer
                        format: int64
                        description: Unix seconds of the earliest time the lower bound can expand. Present only while isLowerInExpansionZone is true.
                      regularTradingHours:
                        type: object
                        description: Session window during which the base margin fractions apply; outside it the off-hours fractions apply. Omitted for 24/7 markets (crypto).
                        properties:
                          startSecondsOfDay:
                            type: integer
                            format: int32
                          endSecondsOfDay:
                            type: integer
                            format: int32
                          timezone:
                            type: string
                            example: America/New_York
                          isOvernight:
                            type: boolean
                      type:
                        type: string
                        example: PERPETUAL
                      assetResolution:
                        type: string
                      pythId:
                        type: string
                  properties: {}
    OraclePricesUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: channel_data
            contents:
              type: object
              required:
                - epoch
                - prices
              properties:
                epoch:
                  type: integer
                  format: int64
                  description: Batch publish time in Unix nanoseconds.
                  example: 1780410803000000000
                prices:
                  type: array
                  description: One entry per market updated in this batch.
                  items:
                    type: object
                    required:
                      - marketDisplayName
                      - marketId
                      - price
                      - markPrice
                    properties:
                      marketDisplayName:
                        type: string
                        description: Display name / ticker (e.g. "BTC-USD").
                        example: SLV-USD
                      marketId:
                        type: integer
                        minimum: 0
                        maximum: 65535
                        description: Perpetual market identifier (uint16).
                        example: 20
                      price:
                        type: string
                        description: Latest oracle price (decimal string).
                        example: '68.39'
                      markPrice:
                        type: string
                        description: 'Authoritative mark price stamped by the matching engine (decimal string). "0" means unavailable; callers must not fall back to `price`.

                          '
                        example: '68.39'
                      markEpochNanos:
                        type: integer
                        format: int64
                        description: 'Wall-clock timestamp in Unix nanoseconds at which the mark price was signed. Omitted when unavailable.

                          '
                        example: 1780410803000000000
    BBOUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: channel_data
            contents:
              type: object
              required:
                - bestBid
                - bestAsk
                - timestamp
                - lastSequenceId
                - globalSequenceId
              properties:
                bestBid:
                  type: object
                  nullable: true
                  description: Best bid level, or null when the bid side is empty.
                  required:
                    - price
                    - size
                  properties:
                    price:
                      type: string
                      example: '94500.00'
                    size:
                      type: string
                      example: '1.5'
                bestAsk:
                  type: object
                  nullable: true
                  description: Best ask level, or null when the ask side is empty.
                  required:
                    - price
                    - size
                  properties:
                    price:
                      type: string
                      example: '94501.00'
                    size:
                      type: string
                      example: '0.8'
                timestamp:
                  type: integer
                  format: int64
                  description: Unix microseconds when the top-of-book was stamped.
                  example: 1780410803123456
                lastSequenceId:
                  type: integer
                  description: Per-market orderbook sequence for this BBO frame.
                  example: 2001
                globalSequenceId:
                  type: integer
                  description: Cross-market monotonic sequence.
                  example: 880422
    AccountAttributesLeverageEntry:
      type: object
      required:
        - type
        - marketId
        - marketDisplayName
        - leverage
      properties:
        type:
          type: string
          enum:
            - leverage
          description: Discriminator for per-market leverage entries.
        marketId:
          type: integer
          description: Market identifier. BTC-USD is `0` and is always present.
        marketDisplayName:
          type: string
          example: BTC-USD
        leverage:
          type: integer
          minimum: 1
          description: Effective leverage (user override or market default).
        isolated:
          type: boolean
          description: '`true` = ISOLATED margin mode; `false` = CROSS. Always present. In snapshot frames reflects persisted state; in streaming frames reflects the account''s margin mode after the event (defaults to CROSS if the lookup fails).'
        marginMode:
          type: string
          enum:
            - CROSS
            - ISOLATED
          description: Human-readable form of `isolated`. Always present alongside `isolated`.
    AccountAttributesFeeTierEntry:
      type: object
      required:
        - type
        - feeTierLevel
        - makerFeePpm
        - takerFeePpm
      properties:
        type:
          type: string
          enum:
            - feeTier
          description: Discriminator for account-level fee tier entries.
        feeTierLevel:
          type: integer
          minimum: 0
          description: |
            Tier level index (0=Base, 1=Bronze, 2=Silver, 3=Gold, 4=Platinum, 5=VIP, 6=Max). Base tier is `0` and is always present.
        makerFeePpm:
          type: integer
          format: int32
          description: Maker fee rate in ppm — parts-per-million of notional (e.g. 200 = 0.02% = 2 bps).
        takerFeePpm:
          type: integer
          format: int32
          description: Taker fee rate in ppm — parts-per-million of notional (e.g. 500 = 0.05% = 5 bps).
    AccountAttributesLeverageRejectEntry:
      type: object
      description: |
        Emitted (streaming only, never in a snapshot) when the engine REJECTS a setLeverage request. The change did not take effect — `leverage` echoes the account's unchanged current value. Correlate with the originating request via `requestId` (returned in the WS `setLeverage` 202 ACK / the `POST /v1/setLeverage` response). A successful change instead surfaces as an `AccountAttributesLeverageEntry`. When `isolated` was also part of the request the margin mode outcome is folded in via the optional `isolated`, `marginMode`, `marginModeStatus`, and `marginModeRejectReason` fields.
      required:
        - type
        - marketId
        - marketDisplayName
        - leverage
        - status
        - rejectReason
        - requestId
      properties:
        type:
          type: string
          enum:
            - leverageReject
          description: Discriminator for a rejected setLeverage request.
        marketId:
          type: integer
          description: Market identifier from the rejected request.
        marketDisplayName:
          type: string
          example: BTC-USD
          description: Falls back to `MARKET-<id>` when the market id is unknown (UNKNOWN_MARKET reject).
        leverage:
          type: integer
          description: The account's unchanged current leverage (`0` when no override exists).
        status:
          type: string
          enum:
            - REJECTED
          description: Engine-lifecycle marker. Always `REJECTED` for this entry.
        rejectReason:
          type: string
          enum:
            - UNDERCOLLATERALIZED
            - INVALID_LEVERAGE
            - UNKNOWN_MARKET
            - HAS_OPEN_POSITION
          description: Why the engine refused the leverage change.
        requestId:
          type: string
          description: Correlates with the `requestId` returned in the setLeverage 202 ACK.
        isolated:
          type: boolean
          description: Present when `isolated` was supplied on the request. `true` = ISOLATED; `false` = CROSS.
        marginMode:
          type: string
          enum:
            - CROSS
            - ISOLATED
          description: Human-readable form of `isolated`. Omitted when no margin mode change was requested.
        marginModeStatus:
          type: string
          enum:
            - APPLIED
            - REJECTED
          description: Outcome of the margin mode portion of the request.
        marginModeRejectReason:
          type: string
          enum:
            - UNKNOWN_MARKET
            - HAS_OPEN_POSITION
          description: Why the margin mode change was refused. Only present when `marginModeStatus` is `REJECTED`.
    AccountAttributesEntry:
      oneOf:
        - $ref: '#/components/schemas/AccountAttributesLeverageEntry'
        - $ref: '#/components/schemas/AccountAttributesFeeTierEntry'
        - $ref: '#/components/schemas/AccountAttributesLeverageRejectEntry'
      discriminator: type
    AccountAttributesUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            contents:
              type: object
              required:
                - isSnapshot
                - entries
              properties:
                isSnapshot:
                  type: boolean
                  description: True for subscribe-time snapshots; false for streaming deltas.
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/AccountAttributesEntry'
    ExchangeAttributesFeeTierTier:
      type: object
      description: One tier row in a feeTierConfig exchange attribute entry.
      required:
        - level
        - name
        - volumeThreshold
        - makerFeePpm
        - takerFeePpm
      properties:
        level:
          type: integer
          format: uint8
          description: |
            Tier level index (0=Base, 1=Bronze, 2=Silver, 3=Gold, 4=Platinum, 5=VIP, 6=Max).
        name:
          type: string
          description: Human-readable tier name (e.g. "Base", "Gold").
        volumeThreshold:
          type: integer
          format: int64
          description: |
            30-day notional volume threshold in USD×1e6 required to reach this tier. Always 0 for the base tier.
        makerFeePpm:
          type: integer
          format: int32
          description: |
            Maker fee rate in ppm — parts-per-million of notional (e.g. 200 = 0.02% = 2 bps). Negative values indicate a maker rebate.
        takerFeePpm:
          type: integer
          format: int32
          description: 'Taker fee rate in ppm — parts-per-million of notional (e.g. 500 = 0.05% = 5 bps). Always ≥ 0.

            '
    ExchangeAttributesEntry:
      type: object
      description: |
        A discriminated-union entry in the exchangeAttributeUpdates stream, discriminated by `type`: `"feeTierConfig"` (full fee tier table) or `"marketAttributes"` (per-market RTH / VWAP-seal / trading-bound edge events — DEPRECATED, superseded by the dedicated `marketAttributes` channel whose entries carry the market's full attribute state).
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - feeTierConfig
            - marketAttributes
          description: Discriminator. `"feeTierConfig"` carries the full fee tier table; `"marketAttributes"` carries one per-market RTH or trading-bound event.
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeAttributesFeeTierTier'
          description: |
            Present when `type` is `"feeTierConfig"`. Full replacement of the exchange fee tier table, sorted ascending by level.
        marketId:
          type: integer
          description: Numeric market id (marketAttributes entries only).
        marketDisplayName:
          type: string
          description: Market ticker (marketAttributes entries only).
          example: INTC-USD
        isOutsideRth:
          type: boolean
          description: Regular Trading Hours state after the event (marketAttributes entries only).
        sealedVwapSettlementPrice:
          type: string
          description: Sealed VWAP settlement price (decimal USD) anchoring the off-hours trading band (marketAttributes entries only; omitted when the frame carries no seal).
          example: '23.41'
        boundEvent:
          type: string
          enum:
            - exitRth
            - enterRth
            - expansionZoneEntered
            - expansionZoneExited
            - tradingBoundExpanded
          description: 'Event kind (marketAttributes entries only; always present on these entries). RTH transitions: `exitRth` (market leaves regular trading hours) / `enterRth` (market re-enters). Off-hours bound events: `expansionZoneEntered` (side''s impact-price EWMA crossed within 90% of its trading boundary, starting the 1-hour expansion clock), `expansionZoneExited` (EWMA relaxed out before the hour completed; clock reset), `tradingBoundExpanded` (clock completed; band widened one level on the 0.5×→1×→2×→4× ladder). Every entry also carries the per-side zone state (`upperZoneEnteredAt` / `upperExpectedExpansionAt` / `lowerZoneEnteredAt` / `lowerExpectedExpansionAt`), mirrored on `GET /v1/markets`. (Historical frames may carry the retired `boundHit` / `boundExpand` values.)'
        boundSide:
          type: string
          enum:
            - upper
            - lower
          description: Which band edge fired on bound-event deltas ("upper" / "lower"). Null on RTH-transition (`exitRth` / `enterRth`) and VWAP-seal deltas.
        boundPrice:
          type: string
          description: Actual boundary price (decimal USD) in force when the bound event fired — the boundary being pressured for a zone event, the pre-expansion boundary for a `tradingBoundExpanded`.
          example: '13.52'
        newBoundPrice:
          type: string
          description: Boundary price (decimal USD) after the bound event — equals `boundPrice` for zone events, the widened boundary for a `tradingBoundExpanded`.
          example: '12.02'
        upperZoneEnteredAt:
          type: integer
          format: int64
          description: Unix seconds at which the upper side entered its expansion zone, carried on every marketAttributes entry. Omitted when the upper side is not in its zone.
        upperExpectedExpansionAt:
          type: integer
          format: int64
          description: Unix seconds of the earliest time the upper bound can expand (zoneEnteredAt + one hour; not a guarantee — the EWMA must still be in the zone when the hour completes). Omitted when the upper side is not in its zone.
        lowerZoneEnteredAt:
          type: integer
          format: int64
          description: Unix seconds at which the lower side entered its expansion zone. Omitted when the lower side is not in its zone.
        lowerExpectedExpansionAt:
          type: integer
          format: int64
          description: Unix seconds of the earliest time the lower bound can expand. Omitted when the lower side is not in its zone.
        timestamp:
          type: integer
          format: int64
          description: Event time in Unix microseconds (marketAttributes entries only).
        marketSequenceNum:
          type: integer
          format: int64
          description: Per-market transaction sequence number (marketAttributes entries only). One engine transaction can emit several entries for a market (e.g. both bound sides transitioning on one tick) and they share this value — it identifies the transaction, not the individual entry, so do not dedup entries by it alone.
    ExchangeAttributesUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            contents:
              type: object
              required:
                - isSnapshot
                - entries
              properties:
                isSnapshot:
                  type: boolean
                  description: |
                    True for the subscribe-time snapshot; false for streaming updates triggered by operator fee tier edits.
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExchangeAttributesEntry'
    MarketAttributesEntry:
      type: object
      description: |
        One market's complete RTH / off-hours attribute block. Every attribute field is present on every entry — `null` when it does not currently apply (in-RTH markets carry null bounds; a side not in its expansion zone carries null zone timestamps). Field semantics match the fields of the same names on `GET /v1/markets`. The `boundEvent` / `boundSide` / `timestamp` / `marketSequenceNum` annotations appear only on streaming updates, never on snapshot entries.
      required:
        - marketId
        - marketDisplayName
        - offHoursInitialMarginFraction
        - isOutsideRth
        - currentSettlementPrice
        - upperTradingBound
        - lowerTradingBound
        - nextUpperTradingBound
        - nextLowerTradingBound
        - isUpperInExpansionZone
        - isLowerInExpansionZone
        - upperZoneEnteredAt
        - upperExpectedExpansionAt
        - lowerZoneEnteredAt
        - lowerExpectedExpansionAt
      properties:
        marketId:
          type: integer
          description: Numeric market id.
        marketDisplayName:
          type: string
          description: Market ticker.
          example: INTC-USD
        offHoursInitialMarginFraction:
          type: string
          description: |
            Initial margin fraction the engine enforces outside the market's RTH window (maintenance margin is not uplifted off-hours).
          example: '0.2'
        isOutsideRth:
          type: boolean
          description: |
            Current Regular Trading Hours state. Always `false` for 24/7 markets (crypto), which never leave regular trading hours. `null` while the server has not yet learned an RTH market's state (briefly after a deploy).
          nullable: true
        currentSettlementPrice:
          type: string
          description: |
            Sealed VWAP settlement price (decimal USD) anchoring the off-hours trading band. `null` in-RTH (no anchor).
          example: '150.25'
          nullable: true
        upperTradingBound:
          type: string
          description: |
            Actual upper boundary (decimal USD) of the off-hours band: anchor + anchor × initialMarginFraction × bandMultiplier, where the multiplier walks the 0.5×→1×→2×→4× ladder independently per side. `null` in-RTH.
          example: '165.28'
          nullable: true
        lowerTradingBound:
          type: string
          description: Actual lower boundary of the off-hours band. `null` in-RTH.
          example: '135.23'
          nullable: true
        nextUpperTradingBound:
          type: string
          description: |
            Boundary the upper band moves to if it expands one level (equals `upperTradingBound` at the 4× ceiling). `null` in-RTH.
          example: '180.30'
          nullable: true
        nextLowerTradingBound:
          type: string
          description: Boundary the lower band moves to if it expands one level. `null` in-RTH.
          example: '120.20'
          nullable: true
        isUpperInExpansionZone:
          type: boolean
          description: |
            Whether the upper side is in its expansion zone (its 1-hour impact-price EWMA is holding within 90% of the boundary). `null` in-RTH.
          nullable: true
        isLowerInExpansionZone:
          type: boolean
          description: Whether the lower side is in its expansion zone. `null` in-RTH.
          nullable: true
        upperZoneEnteredAt:
          type: integer
          format: int64
          description: |
            Unix seconds the upper side entered its expansion zone. `null` when not in the zone.
          nullable: true
        upperExpectedExpansionAt:
          type: integer
          format: int64
          description: |
            Earliest Unix seconds the upper bound can expand (zoneEnteredAt
            + one hour; not a guarantee — the EWMA must still be in the zone when the hour completes). `null` when not in the zone.
          nullable: true
        lowerZoneEnteredAt:
          type: integer
          format: int64
          description: Unix seconds the lower side entered its expansion zone. `null` when not in the zone.
          nullable: true
        lowerExpectedExpansionAt:
          type: integer
          format: int64
          description: Earliest Unix seconds the lower bound can expand. `null` when not in the zone.
          nullable: true
        boundEvent:
          type: string
          enum:
            - exitRth
            - enterRth
            - expansionZoneEntered
            - expansionZoneExited
            - tradingBoundExpanded
          description: |
            Event annotation for streaming updates. Omitted only on snapshot entries — always present on delta entries, since every update frame is either an RTH transition or a bound event. `exitRth` (market leaves regular trading hours) / `enterRth` (market re-enters) — the block itself carries the resulting state, so there is no separate bound-price field for these. `expansionZoneEntered` (side's impact-price EWMA crossed within 90% of its boundary, starting the 1-hour expansion clock), `expansionZoneExited` (EWMA relaxed out; clock reset), `tradingBoundExpanded` (clock completed; band widened one level on the 0.5×→1×→2×→4× ladder — the new boundary IS the block's `upperTradingBound` / `lowerTradingBound`).
        boundSide:
          type: string
          enum:
            - upper
            - lower
          description: |
            Which band edge fired on bound-event deltas ("upper" / "lower"). Null on snapshot entries and on RTH-transition (`exitRth` / `enterRth`) deltas.
        timestamp:
          type: integer
          format: int64
          description: Event time in Unix microseconds (streaming updates only).
        marketSequenceNum:
          type: integer
          format: int64
          description: |
            Per-market transaction sequence number (streaming updates only). Entries emitted by one engine transaction share this value — it identifies the transaction, not the entry, so do not dedup by it alone.
    MarketAttributesChannelPayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            contents:
              type: object
              required:
                - isSnapshot
                - entries
              properties:
                isSnapshot:
                  type: boolean
                  description: |
                    True for the subscribe-time snapshot (one entry per RTH market); false for streaming updates (one entry for the affected market).
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/MarketAttributesEntry'
    OrderUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            contents:
              type: object
              properties:
                orderId:
                  type: string
                clientId:
                  type: string
                marketId:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: Perpetual market identifier (uint16). Map to display name via `GET /markets`.
                marketDisplayName:
                  type: string
                  example: BTC-USD
                side:
                  type: string
                  enum:
                    - BUY
                    - SELL
                status:
                  type: string
                  enum:
                    - OPEN
                    - FILLED
                    - CANCELED
                    - MARGIN_CANCELED
                    - REJECTED
                    - TPSL_PLACED
                    - TPSL_CANCELED
                    - TPSL_TRIGGERED
                price:
                  type: string
                  description: Limit price. All TPSL lifecycle events (TPSL_PLACED, TPSL_TRIGGERED, TPSL_CANCELED, trigger-time REJECTED) carry the leg's limit price here; market-type TPSLs placed without a price report "0" — use triggerPrice for the trigger level.
                  example: '94000.00'
                originalSize:
                  type: string
                  example: '1.0'
                remainingSize:
                  type: string
                  description: '"0.0" means fully filled.'
                  example: '0.5'
                avgFillPrice:
                  type: string
                  description: 'Cumulative average fill price across all fills of this order. Present whenever the order has any filled quantity; absent when nothing has filled. Matches the REST / snapshot `avgFillPrice`.

                    '
                  example: '94000.00'
                triggerPrice:
                  type: string
                  description: Set for TP/SL orders only — on TP/SL events and on a REJECTED event for a TP/SL order rejected at placement or at trigger time (e.g. a triggered reduce-only TP/SL whose position flipped, or a triggered FOK that cannot fully fill). A TP/SL that converted to a regular order and was rejected after conversion does not carry TP/SL fields.
                tpslType:
                  type: string
                  enum:
                    - TAKE_PROFIT
                    - STOP_LOSS
                  description: Set for TP/SL orders only.
                rejectionReason:
                  type: string
                  description: Non-empty when status is REJECTED.
                cancelReason:
                  type: string
                  enum:
                    - MODIFY_CANCELED
                  description: 'Qualifies a CANCELED update when the matching engine stamped a reason. Currently the only value is MODIFY_CANCELED: this cancel is the first leg of a modify — the SAME orderId is re-placed by the account''s very next update (PLACED / FILLED / REJECTED), so the order is not terminally gone unless that follow-up says so. Absent on all other cancels, which are genuinely terminal.

                    '
                state:
                  type: string
                  enum:
                    - OPEN
                    - PARTIALLY_FILLED
                    - FILLED
                    - CANCELED
                    - REJECTED
                  description: |
                    Order lifecycle state after this event. `PARTIALLY_FILLED` is terminal for IOC orders. Any explicit cancel produces `CANCELED` even when prior fills had already partially filled the order.
                positionEffect:
                  type: string
                  enum:
                    - OPEN_LONG
                    - OPEN_SHORT
                    - ADD_LONG
                    - ADD_SHORT
                    - CLOSE_LONG
                    - CLOSE_SHORT
                    - FLIP_LONG_TO_SHORT
                    - FLIP_SHORT_TO_LONG
                  description: |
                    How this fill changed the account's position. Only set on fill events; absent on placements/cancels/rejects. `FLIP_*` covers a position that closed and reopened on the opposite side within one user order.
                createdAt:
                  type: integer
                  format: int64
                  description: Order placement time (epoch microseconds); stable across updates.
                updatedAt:
                  type: integer
                  format: int64
                  description: Time of this update event (epoch microseconds).
                sequenceNumber:
                  type: integer
                  format: uint64
                  description: Per-account sequence of this order event (same counter as AccountUpdate.sequenceNumber).
    FundingPayment:
      type: object
      description: |
        One applied funding payment for an (account, market) at a single funding payment time. Same shape as REST `GET /v1/funding` `FundingPayment`.
      required:
        - marketId
        - marketDisplayName
        - fundingRate
        - size
        - payment
        - time
      properties:
        marketId:
          type: integer
          minimum: 0
          maximum: 65535
        marketDisplayName:
          type: string
          example: BTC-USD
        fundingRate:
          type: string
          description: Hourly funding rate (decimal string).
          example: '0.00001234'
        size:
          type: string
          description: Signed position size when the payment was computed.
          example: '0.5'
        payment:
          type: string
          description: |
            Quote-currency amount applied. Positive = trader received, negative = trader paid.
          example: '-3.21'
        time:
          type: integer
          format: int64
          description: Funding payment time (Unix microseconds).
          example: 1700003600000000
    FundingPaymentsSnapshotPayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: subscribed
            contents:
              type: object
              required:
                - isSnapshot
                - fundingPayments
              properties:
                isSnapshot:
                  type: boolean
                  example: true
                fundingPayments:
                  type: array
                  description: Up to 100 most recent funding payments.
                  items:
                    $ref: '#/components/schemas/FundingPayment'
    FundingPaymentUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: channel_data
            contents:
              $ref: '#/components/schemas/FundingPayment'
    PredictedFundingRate:
      type: object
      description: |
        Predicted next-hour funding rate as published by the funder. Not wrapped in an isSnapshot envelope. May be empty in the subscribe-time snapshot when no prediction is cached for the market yet.
      properties:
        market:
          type: string
          description: Market display name.
          example: BTC-USD
        rate1h:
          type: string
          description: Predicted 1-hour funding rate as a decimal string.
          example: '0.0000125'
    PredictedFundingSnapshotPayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: subscribed
            contents:
              $ref: '#/components/schemas/PredictedFundingRate'
    PredictedFundingUpdatePayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: channel_data
            contents:
              $ref: '#/components/schemas/PredictedFundingRate'
    AccountTransferEvent:
      type: object
      description: |
        One account transfer event. Same shape as `AccountTransferEvent` in `openapi.yaml`.
      required:
        - type
        - eventId
        - amount
        - netQuoteBalance
        - globalSequenceId
        - accountSequenceNum
      properties:
        type:
          type: string
          enum:
            - DEPOSIT
            - WITHDRAWAL
            - INTERNAL_TRANSFER
            - SELF_ACCOUNT_TRANSFER
            - REFERRAL_CLAIM
          description: |
            Kind of account transfer event.
        eventId:
          type: string
          description: deposit_id, withdrawal_id, or transfer_id.
          example: dep-abc123
        amount:
          type: string
          description: |
            Credited (deposit / transfer-in) or debited (withdrawal / transfer-out) amount as a decimal string.
          example: '100.00'
        netQuoteBalance:
          type: string
          description: |
            Perspective account's post-event aggregate cash balance as a decimal string.
          example: '1234.56'
        globalSequenceId:
          type: integer
          format: int64
          description: Strict ordering across all engine events.
          example: 9600000001
        accountSequenceNum:
          type: integer
          format: int64
          description: |
            Post-op per-account sequence number for the perspective account. Matches `AccountUpdate.sequenceNum`.
          example: 42
        sourceAccountId:
          type: string
          description: Sender's wire account ID. Populated only for transfer events.
        destinationAccountId:
          type: string
          description: Recipient's wire account ID. Populated only for transfer events.
    AccountTransferUpdatesPayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            contents:
              type: object
              required:
                - isSnapshot
                - accountTransferEvents
              properties:
                isSnapshot:
                  type: boolean
                  description: True for the subscribe-time snapshot; false for streaming updates.
                accountTransferEvents:
                  type: array
                  description: Newest-first in snapshots; exactly one event in streaming updates.
                  items:
                    $ref: '#/components/schemas/AccountTransferEvent'
    CandlesSnapshotPayload:
      allOf:
        - $ref: '#/components/schemas/ChannelDataEnvelope'
        - type: object
          properties:
            type:
              const: subscribed
            contents:
              type: object
              properties:
                isSnapshot:
                  type: boolean
                  example: true
                candles:
                  type: array
                  description: Oldest first. Last entry is the open (in-progress) bar.
                  items:
                    $ref: '#/components/schemas/Candle'
    Candle:
      type: object
      properties:
        open:
          type: string
          example: '94000.00'
        high:
          type: string
          example: '94800.00'
        low:
          type: string
          example: '93500.00'
        close:
          type: string
          example: '94500.00'
        volume:
          type: string
          example: '123.45'
        openTime:
          type: integer
          format: int64
          description: Unix timestamp (microseconds) of the bar open (candle bucket start).
          example: 1712345640000000
        isFinal:
          type: boolean
          description: True when the bar is closed and will not be updated again.
          example: false
    SignedRequest:
      type: object
      description: Signing fields required for all order mutation requests.
      required:
        - apiKey
        - timestamp
        - signature
      properties:
        apiKey:
          type: string
          description: Ed25519 public key (64 hex characters).
          example: <64-hex-public-key>
        timestamp:
          type: string
          description: |
            Unix epoch nanoseconds as a string. Millisecond or second epochs are rejected with `401`; must be within ±30s of server wall-clock.
          example: '1712345678000000000'
        signature:
          type: string
          description: |
            Ed25519 signature (128 hex characters). For `placeOrder`, `cancelOrder`, and `modifyOrder` sign the **typed canonical payload** (the JSON object IS the signing message).             For legacy methods (`cancelAllOrders`, `setLeverage`, `adjustIsolatedMargin`) sign `timestamp + action + canonicalJSON(request.payload)` where `action` is the canonical camelCase method name.
          example: <128-hex-signature>
    BatchSignedRequest:
      type: object
      description: |
        Envelope signing fields for BATCH order mutations (batchPlaceOrders / batchCancelOrders). Unlike `SignedRequest`, there is NO envelope `signature` — each element of the batch array carries its own per-order `signature` instead. Only the shared `apiKey` + `timestamp` live here.
      required:
        - apiKey
        - timestamp
      properties:
        apiKey:
          type: string
          description: Ed25519 public key (64 hex characters).
          example: <64-hex-public-key>
        timestamp:
          type: string
          description: |
            Unix epoch nanoseconds as a string, shared by every order in the batch. Millisecond or second epochs are rejected with `401`; must be within ±30s of server wall-clock.
          example: '1712345678000000000'
    OrderRequestItem:
      type: object
      description: |
        A single order. Identical shape to the `placeOrder` payload and to each element of a `batchPlaceOrders` `orders` array.
      required:
        - address
        - accountIndex
        - marketId
        - orderSide
        - orderType
        - timeInForce
        - quantity
        - goodTilTime
      properties:
        address:
          type: string
          description: Master EVM address; must match the API key's master account.
          example: 0x...
        accountIndex:
          type: integer
          minimum: 0
          maximum: 9
          description: Subaccount index (0–9).
          example: 0
        marketId:
          type: integer
          description: Market enum (e.g. 1 = BTC-USD, 2 = ETH-USD).
          example: 0
        orderSide:
          type: string
          enum:
            - BUY
            - SELL
        orderType:
          type: string
          enum:
            - LIMIT
            - MARKET
          description: |
            Execution style. TPSL trigger orders are still `LIMIT` or `MARKET` here — the trigger semantics come from `tpslType` + `stopPrice`.
        timeInForce:
          type: string
          enum:
            - GTT
            - IOC
            - FOK
            - ALO
          description: 'GTT = Good Till Time (rests until goodTilTime), IOC = Immediate or Cancel, FOK = Fill or Kill, ALO = Add Liquidity Only (post-only). Note: order reads currently report resting orders as GTC (legacy name for GTT). Reduce-only non-TPSL orders must be IOC or FOK. TPSL LIMIT legs must be GTT.'
        goodTilTime:
          type: string
          description: Order expiry as an epoch-microsecond timestamp (string). REQUIRED for all order types, including IOC/FOK (which never rest) — a mandatory replay-protection timestamp; omitting it is rejected with `goodTilTime is required`. Must be at least one month in the future. Covered by the per-order signature (`g`, in nanoseconds).
          example: '4102444800000000'
        quantity:
          type: string
          description: Order size in base asset, human-readable decimal. Must be at most the market's `maxOrderSize` (see `GET /markets`); reduce-only orders are **not** exempt — rejected with `OrderSizeTooLarge`.
          example: '0.01'
        price:
          type: string
          description: Human-readable decimal price. Required for `LIMIT` orders (resting limit price) and for **all** `MARKET` orders (protective slippage bound). For plain `MARKET` orders the value must be a positive decimal within **10% of the current mark price**; orders outside this band are rejected with `MarketPriceSlippageToleranceTooHigh`. For TPSL `MARKET` orders the value must be within **10% of `stopPrice`** (trigger price) — at trigger time the mark price ≈ stopPrice, so this enforces the same ±10% slippage protection.
          example: '50000'
        clientId:
          type: string
          description: Optional client-supplied order id (idempotency / cancel-by-clientId).
        clientTime:
          type: string
          description: Optional client timestamp (Unix nanoseconds, as a string) — the signed `ct`; when set it must equal the envelope `timestamp`.
        reduceOnly:
          type: boolean
          description: If true, the order can only reduce an existing position.
        minSize:
          type: string
          description: Optional minimum fill size, human-readable decimal.
        stopPrice:
          type: string
          description: Trigger price for TPSL orders, human-readable decimal. Required when `tpslType` is set.
        tpslType:
          type: string
          enum:
            - STOP_LOSS
            - TAKE_PROFIT
          description: Marks the order as a take-profit / stop-loss trigger order. Omit for plain orders. For `LIMIT` execution, `timeInForce` must be `GTT`.
        fillMode:
          type: string
          description: Optional fill-mode hint.
        signature:
          type: string
          description: |
            Per-order Ed25519 signature (128 hex), REQUIRED when this order is an element of a `batchPlaceOrders` array, omitted for single `placeOrder`. Signed over the typed canonical `placeOrder` payload (op=1; op=4 for TPSL legs) — identical to the bytes signed for a standalone `placeOrder`. The shared `timestamp` envelope value is the `ct` field inside the payload.
    CancelRequestItem:
      type: object
      description: |
        A single cancel. Identical shape to the `cancelOrder` payload and to each element of a `batchCancelOrders` `cancels` array. Provide exactly one of `orderId` or `clientId` (use `kind` to disambiguate when both could apply).
      required:
        - address
        - accountIndex
        - marketId
      properties:
        address:
          type: string
          description: Master EVM address; must match the API key's master account.
          example: 0x...
        accountIndex:
          type: integer
          minimum: 0
          maximum: 9
          description: Subaccount index (0–9).
          example: 0
        marketId:
          type: integer
          description: Market enum (e.g. 1 = BTC-USD).
          example: 0
        kind:
          type: string
          enum:
            - orderId
            - clientId
          description: Which identifier to cancel by. Defaults to `orderId` when `orderId` is present.
        orderId:
          type: string
          description: System order id. One of `orderId` or `clientId` is required.
        clientId:
          type: string
          description: Client-supplied order id from the prior `placeOrder`.
        validUntil:
          type: integer
          format: int64
          description: Optional expiry for the cancel itself (unix seconds).
        signature:
          type: string
          description: |
            Per-cancel Ed25519 signature (128 hex), REQUIRED when this cancel is an element of a `batchCancelOrders` array, omitted for single `cancelOrder`. Signed over the typed canonical `cancelOrder` payload — identical to the bytes signed for a standalone `cancelOrder`. The shared `timestamp` envelope value is the `ct` field inside the payload.
    ModifyRequestItem:
      type: object
      description: |
        A single modify. Identical shape to the `modifyOrder` payload and to each element of a `batchModifyOrders` `modifies` array. Identify the order to modify by **exactly one** of `orderId` or `clientId` — providing both (or neither) is rejected.
      required:
        - address
        - accountIndex
        - marketId
        - side
        - quantity
        - price
        - timeInForce
        - reduceOnly
        - goodTilTime
      properties:
        address:
          type: string
          description: Master EVM address; must match the API key's master account.
          example: 0x...
        accountIndex:
          type: integer
          minimum: 0
          maximum: 9
          description: Subaccount index (0–9).
          example: 0
        marketId:
          type: integer
          description: Market enum (e.g. 1 = BTC-USD).
          example: 0
        orderId:
          type: string
          description: Server order id to modify. Provide exactly one of `orderId` or `clientId`.
        clientId:
          type: string
          description: |
            Placement-time client id identifying the order to modify (resolved engine-side against the account's client-id index). Provide exactly one of `orderId` or `clientId` — supplying both is rejected. Lets a client modify an order before the place response (with the server orderId) has arrived.
        side:
          type: string
          enum:
            - BUY
            - SELL
        quantity:
          type: string
          description: New size, human-readable decimal. Must be at most the market's `maxOrderSize`; reduce-only orders are not exempt — rejected with `OrderSizeTooLarge`.
        price:
          type: string
        timeInForce:
          type: string
          enum:
            - GTT
            - IOC
            - FOK
            - ALO
          description: 'GTT = Good Till Time (rests until goodTilTime), IOC = Immediate or Cancel, FOK = Fill or Kill, ALO = Add Liquidity Only (post-only). Note: order reads currently report resting orders as GTC (legacy name for GTT).'
        reduceOnly:
          type: boolean
          description: Reduce-only flag. Required — must be explicitly true or false (immutable; echo the resting order's value). Covered by the request signature.
        goodTilTime:
          type: string
          description: Required — the order's expiry as epoch microseconds (string), echoed from placement (a differing value performs a cancel-replace with the new expiry). Must be at least one month in the future. Covered by the request signature (`g`, in nanoseconds).
        clientTime:
          type: string
          description: Optional client timestamp (Unix nanoseconds, as a string) — the signed `ct`; when set it must equal the envelope `timestamp`.
        signature:
          type: string
          description: |
            Per-modify Ed25519 signature (128 hex), REQUIRED when this modify is an element of a `batchModifyOrders` array, omitted for single `modifyOrder`. Signed over the typed canonical `modifyOrder` payload — identical to the bytes signed for a standalone `modifyOrder`. The shared `timestamp` envelope value is the `ct` field inside the payload.
