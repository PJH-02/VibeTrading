components:
  messages:
    SubscribeL2Orderbook:
      name: SubscribeL2Orderbook
      title: Subscribe to L2 Orderbook
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeL2OrderbookPayload'
      examples:
        - name: Subscribe BTC-USD (50 levels)
          payload:
            type: subscribe
            channel: l2Orderbook
            id: BTC-USD
            nLevels: 50
        - name: Subscribe ETH-USD (default levels)
          payload:
            type: subscribe
            channel: l2Orderbook
            id: ETH-USD
        - name: Subscribe BTC-USD aggregated to 5 sig figs, $2 buckets
          payload:
            type: subscribe
            channel: l2Orderbook
            id: BTC-USD
            sigFigs: 5
            roundStep: 2
        - name: Second view of BTC-USD at 3 sig figs on the same connection
          payload:
            type: subscribe
            channel: l2Orderbook
            id: BTC-USD
            sigFigs: 3
    SubscribeL2OrderbookUpdates:
      name: SubscribeL2OrderbookUpdates
      title: Subscribe to L2 Orderbook incremental updates
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeL2OrderbookUpdatesPayload'
      examples:
        - name: Subscribe BTC-USD (50 levels)
          payload:
            type: subscribe
            channel: l2OrderbookUpdates
            id: BTC-USD
            nLevels: 50
        - name: Subscribe ETH-USD, deltas only (no initial snapshot)
          payload:
            type: subscribe
            channel: l2OrderbookUpdates
            id: ETH-USD
            snapshot: false
    SubscribeByMarket:
      name: SubscribeByMarket
      title: Subscribe to a market channel
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeByMarketPayload'
      examples:
        - name: Subscribe BTC-USD trades
          payload:
            type: subscribe
            channel: trades
            id: BTC-USD
    SubscribeByAddress:
      name: SubscribeByAddress
      title: Subscribe to an account channel
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeByAddressPayload'
      examples:
        - name: Subscribe by Ethereum address
          payload:
            type: subscribe
            channel: account
            id: 0xAbCd...1234
    SubscribeGlobal:
      name: SubscribeGlobal
      title: Subscribe to the markets channel
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeGlobalPayload'
      examples:
        - name: Subscribe to all markets
          payload:
            type: subscribe
            channel: markets
    SubscribeExchangeAttributeUpdates:
      name: SubscribeExchangeAttributeUpdates
      title: Subscribe to the exchange attribute updates channel
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeExchangeAttributeUpdatesPayload'
      examples:
        - name: Subscribe to exchange attribute updates
          payload:
            type: subscribe
            channel: exchangeAttributeUpdates
        - name: Subscribe, updates only (no initial snapshot)
          payload:
            type: subscribe
            channel: exchangeAttributeUpdates
            snapshot: false
    SubscribeMarketAttributes:
      name: SubscribeMarketAttributes
      title: Subscribe to the market attributes channel
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeMarketAttributesPayload'
      examples:
        - name: Subscribe to market attributes
          payload:
            type: subscribe
            channel: marketAttributes
        - name: Subscribe, updates only (no initial snapshot)
          payload:
            type: subscribe
            channel: marketAttributes
            snapshot: false
    SubscribeCandles:
      name: SubscribeCandles
      title: Subscribe to candles
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeCandlesPayload'
      examples:
        - name: BTC-USD 1-minute candles
          payload:
            type: subscribe
            channel: candles
            id: BTC-USD/1m
        - name: ETH-USD 1-hour candles
          payload:
            type: subscribe
            channel: candles
            id: ETH-USD/1h
    L2OrderbookSnapshot:
      name: L2OrderbookSnapshot
      title: L2 Orderbook Snapshot
      contentType: application/json
      payload:
        $ref: '#/components/schemas/L2OrderbookSnapshotPayload'
      examples:
        - name: BTC-USD snapshot
          payload:
            type: subscribed
            channel: l2Orderbook
            id: BTC-USD
            contents:
              bids:
                - - '94500.0'
                  - '1.5'
                - - '94499.0'
                  - '2.0'
              asks:
                - - '94501.0'
                  - '0.8'
                - - '94502.0'
                  - '3.1'
              lastSequenceId: 1042
              globalSequenceId: 880421
              timestamp: 1780410803123456
        - name: BTC-USD snapshot aggregated to 3 sig figs
          payload:
            type: subscribed
            channel: l2Orderbook
            id: BTC-USD
            sigFigs: 3
            contents:
              bids:
                - - '94500'
                  - '1.5'
              asks:
                - - '94600'
                  - '0.8'
              lastSequenceId: 1042
              globalSequenceId: 880421
              timestamp: 1780410803123456
    L2OrderbookUpdate:
      name: L2OrderbookUpdate
      title: L2 Orderbook Incremental Update
      contentType: application/json
      description: |
        `size: "0"` means the level was removed. Apply every delta whose `lastSequenceId` exceeds the snapshot's; the first delta may be a few sequences ahead of the snapshot (an expected boundary gap that self-heals — do **not** re-subscribe on it). Once you are applying deltas, sequences are contiguous, so only a **mid-stream** gap means a missed delta — re-subscribe for a fresh snapshot then.
      payload:
        $ref: '#/components/schemas/L2OrderbookUpdatePayload'
      examples:
        - name: BTC-USD delta
          payload:
            type: channel_data
            channel: l2OrderbookUpdates
            id: BTC-USD
            contents:
              bids:
                - - '94499.0'
                  - '0'
              asks:
                - - '94503.0'
                  - '1.2'
              lastSequenceId: 1043
              globalSequenceId: 880422
    TradesUpdate:
      name: TradesUpdate
      title: Trades Update
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TradesUpdatePayload'
      examples:
        - name: BTC-USD trade
          payload:
            type: channel_data
            channel: trades
            id: BTC-USD
            contents:
              - takerOrderId: ord-taker-123
                makerOrderId: ord-maker-456
                takerAddress: 0xaaa...
                makerAddress: 0xbbb...
                price: '94500.00'
                size: '0.5'
                tradeId: trade-789
                timestamp: 1712345679000000
                sequenceNumber: 5001
    MarketsSnapshot:
      name: MarketsSnapshot
      title: Markets Snapshot
      contentType: application/json
      description: |
        Full markets state delivered as the subscribe response. Same shape as the periodic `MarketsUpdate` — the markets channel is snapshot-only.
      payload:
        $ref: '#/components/schemas/MarketsUpdatePayload'
    MarketsUpdate:
      name: MarketsUpdate
      title: Markets Update
      contentType: application/json
      description: |
        Periodic re-snapshot of all markets. Replaces the client's full markets view; there are no partial diffs on this channel.
      payload:
        $ref: '#/components/schemas/MarketsUpdatePayload'
      examples:
        - name: All markets snapshot
          payload:
            type: channel_data
            channel: markets
            contents:
              isSnapshot: true
              markets:
                '1':
                  marketDisplayName: BTC-USD
                  marketId: 1
                  status: ONLINE
                  baseAsset: BTC
                  quoteAsset: USD
                  tickSize: '0.01'
                  stepSize: '0.0001'
                  minOrderSize: '0.0001'
                  maxOrderSize: '10000'
                  oraclePrice: '94500.00'
                  markPrice: '94500.50'
                  lastTradePrice: '94498.00'
                  fundingRate: '0.0001'
                  nextFundingRate: '0.00012'
                  nextFundingAt: 1712349600
                  priceChange24h: '0.025'
                  volume24h: '1234.5678'
                  trades24h: 4242
                  openInterest: '312.4567'
                  initialMarginFraction: '0.05'
                  maintenanceMarginFraction: '0.03'
                  type: PERPETUAL
                '2':
                  marketDisplayName: ETH-USD
                  marketId: 2
                  status: ONLINE
                  baseAsset: ETH
                  quoteAsset: USD
                  oraclePrice: '3050.00'
                  markPrice: '3050.25'
                  lastTradePrice: '3049.80'
                  fundingRate: '0.00005'
                  nextFundingRate: '0.00007'
                  nextFundingAt: 1712349600
                  type: PERPETUAL
    OraclePricesUpdate:
      name: OraclePricesUpdate
      title: Oracle Price Update
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OraclePricesUpdatePayload'
      examples:
        - name: Oracle price batch
          payload:
            type: channel_data
            channel: oraclePrices
            contents:
              epoch: 1780410803000000000
              prices:
                - marketDisplayName: SLV-USD
                  marketId: 20
                  price: '68.39'
                  markPrice: '68.39'
                  markEpochNanos: 1780410803000000000
                - marketDisplayName: BTC-USD
                  marketId: 1
                  price: '94501.00'
                  markPrice: '94500.50'
                  markEpochNanos: 1780410803000000000
    BBOUpdate:
      name: BBOUpdate
      title: Best Bid Offer (BBO) Update
      contentType: application/json
      payload:
        $ref: '#/components/schemas/BBOUpdatePayload'
      examples:
        - name: BTC-USD BBO
          payload:
            type: channel_data
            channel: bbo
            id: BTC-USD
            contents:
              bestBid:
                price: '94500.00'
                size: '1.5'
              bestAsk:
                price: '94501.00'
                size: '0.8'
              timestamp: 1780410803123456
              lastSequenceId: 2001
              globalSequenceId: 880422
    AccountSnapshot:
      name: AccountSnapshot
      title: Account Snapshot
      contentType: application/json
      description: |
        Full account state sent on subscribe, re-broadcast every 5 seconds, and sent shortly after account events. Schema: openapi `AccountsSnapshot` — not the REST `GET /account` shape (`lastSequenceId` and `accountEquity` instead of `sequenceNumber` and `equity`).
      payload:
        $ref: '#/components/schemas/ChannelDataEnvelope'
    AccountUpdate:
      name: AccountUpdate
      title: Account Update
      contentType: application/json
      description: |
        Streaming account event. `type` in `contents` is one of: `PLACED`, `CANCELED`, `MARGIN_CANCELED`, `REJECTED`, `TPSL_PLACED`, `TPSL_CANCELED`, `TPSL_TRIGGERED`, `LIQUIDATION`, `ADL`. `netQuoteBalance` is stamped on every frame. `avgFillPrice` is present whenever the order has any filled quantity (e.g. a cancel after partial fills) and matches the REST / snapshot value.
      payload:
        $ref: '#/components/schemas/ChannelDataEnvelope'
    PositionsSnapshot:
      name: PositionsSnapshot
      title: Positions Snapshot
      contentType: application/json
      description: |
        Sent once on subscribe. Contents use OpenAPI `PositionsSnapshot`: the same `positions` map as REST `GET /positions` (`GetPositionsResponse`) plus required `isSnapshot: true`, `lastSequenceId`, `address`, and `accountIndex`. The snapshot does NOT carry the REST-only `total` field. The required `positions` map is keyed by perp market id; each row carries `sequenceNumber`.
      payload:
        $ref: '#/components/schemas/ChannelDataEnvelope'
    PositionUpdate:
      name: PositionUpdate
      title: Position Update
      contentType: application/json
      description: |
        One position delta per frame (one `PositionUpdate` per streaming event). Contents carry `isSnapshot: false` and `lastSequenceId`. Each update has one row in `positions`.

        Each perp position row carries `sequenceNumber` (same counter as AccountUpdate). `cumulativeFunding` is absent; use the snapshot for funding horizons. On close, emitted in `FLAT` form with zeroed financials.
      payload:
        $ref: '#/components/schemas/ChannelDataEnvelope'
    AccountAttributesSnapshot:
      name: AccountAttributesSnapshot
      title: Account Attributes Snapshot
      contentType: application/json
      description: One leverage entry per market (carrying both leverage and margin mode state), plus one fee tier entry when available. Sent once on subscribe.
      payload:
        $ref: '#/components/schemas/AccountAttributesUpdatePayload'
    AccountAttributesUpdate:
      name: AccountAttributesUpdate
      title: Account Attributes Update
      contentType: application/json
      description: |
        Single-entry delta keyed by `type`. A `leverage` or `feeTier` entry is a state change; a `leverageReject` entry reports a refused request (no state change). When `isolated` was part of a `setLeverage` request the margin mode outcome is carried inside the same entry.
      payload:
        $ref: '#/components/schemas/AccountAttributesUpdatePayload'
    ExchangeAttributesSnapshot:
      name: ExchangeAttributesSnapshot
      title: Exchange Attributes Snapshot
      contentType: application/json
      description: |
        Initial snapshot sent once on subscribe. Contains one `feeTierConfig` entry with the complete current fee tier table (`isSnapshot: true`).
      payload:
        $ref: '#/components/schemas/ExchangeAttributesUpdatePayload'
      examples:
        - name: Fee tier table snapshot
          payload:
            type: subscribed
            channel: exchangeAttributeUpdates
            id: ''
            contents:
              isSnapshot: true
              entries:
                - type: feeTierConfig
                  tiers:
                    - level: 0
                      name: Base
                      volumeThreshold: 0
                      makerFeePpm: 200
                      takerFeePpm: 500
                    - level: 1
                      name: Bronze
                      volumeThreshold: 100000000000
                      makerFeePpm: 150
                      takerFeePpm: 450
    ExchangeAttributesUpdate:
      name: ExchangeAttributesUpdate
      title: Exchange Attributes Update
      contentType: application/json
      description: |
        Streaming update pushed whenever an operator edits the exchange fee tier config. Always carries the full updated table in a single `feeTierConfig` entry (`isSnapshot: false`). Clients should replace their local copy atomically.
      payload:
        $ref: '#/components/schemas/ExchangeAttributesUpdatePayload'
      examples:
        - name: Fee tier table updated
          payload:
            type: channel_data
            channel: exchangeAttributeUpdates
            id: ''
            contents:
              isSnapshot: false
              entries:
                - type: feeTierConfig
                  tiers:
                    - level: 0
                      name: Base
                      volumeThreshold: 0
                      makerFeePpm: 200
                      takerFeePpm: 500
    MarketAttributesSnapshot:
      name: MarketAttributesSnapshot
      title: Market Attributes Snapshot
      contentType: application/json
      description: |
        Initial snapshot sent once on subscribe: one complete attribute block per online market, 24/7 crypto included (`isSnapshot: true`). Every field is present on every entry — `null` when it does not currently apply — so no REST bootstrap is needed.
      payload:
        $ref: '#/components/schemas/MarketAttributesChannelPayload'
      examples:
        - name: Snapshot with a 24/7, an off-hours, and an in-RTH market
          payload:
            type: subscribed
            channel: marketAttributes
            id: ''
            contents:
              isSnapshot: true
              entries:
                - marketId: 0
                  marketDisplayName: BTC-USD
                  offHoursInitialMarginFraction: '0.05'
                  isOutsideRth: false
                  currentSettlementPrice: null
                  upperTradingBound: null
                  lowerTradingBound: null
                  nextUpperTradingBound: null
                  nextLowerTradingBound: null
                  isUpperInExpansionZone: null
                  isLowerInExpansionZone: null
                  upperZoneEnteredAt: null
                  upperExpectedExpansionAt: null
                  lowerZoneEnteredAt: null
                  lowerExpectedExpansionAt: null
                - marketId: 12
                  marketDisplayName: INTC-USD
                  offHoursInitialMarginFraction: '0.2'
                  isOutsideRth: true
                  currentSettlementPrice: '150.25'
                  upperTradingBound: '165.28'
                  lowerTradingBound: '135.23'
                  nextUpperTradingBound: '180.30'
                  nextLowerTradingBound: '120.20'
                  isUpperInExpansionZone: false
                  isLowerInExpansionZone: false
                  upperZoneEnteredAt: null
                  upperExpectedExpansionAt: null
                  lowerZoneEnteredAt: null
                  lowerExpectedExpansionAt: null
                - marketId: 15
                  marketDisplayName: TSLA-USD
                  offHoursInitialMarginFraction: '0.2'
                  isOutsideRth: false
                  currentSettlementPrice: null
                  upperTradingBound: null
                  lowerTradingBound: null
                  nextUpperTradingBound: null
                  nextLowerTradingBound: null
                  isUpperInExpansionZone: null
                  isLowerInExpansionZone: null
                  upperZoneEnteredAt: null
                  upperExpectedExpansionAt: null
                  lowerZoneEnteredAt: null
                  lowerExpectedExpansionAt: null
    MarketAttributesStreamUpdate:
      name: MarketAttributesStreamUpdate
      title: Market Attributes Update
      contentType: application/json
      description: |
        Streaming update pushed on every RTH boundary crossing, VWAP seal, and off-hours bound event. The single entry is the affected market's full post-event attribute block — both sides' bounds, not just the side an event fired on — so clients replace their local entry for `marketId` wholesale. `boundEvent` annotates what fired — always present on delta entries (`exitRth` / `enterRth` on RTH boundary crossings, a bound-event name otherwise); `boundSide` is also always present on delta entries (null on RTH-transition / non-bound-event deltas).
      payload:
        $ref: '#/components/schemas/MarketAttributesChannelPayload'
      examples:
        - name: Upper trading bound expanded
          payload:
            type: channel_data
            channel: marketAttributes
            id: ''
            contents:
              isSnapshot: false
              entries:
                - marketId: 12
                  marketDisplayName: INTC-USD
                  offHoursInitialMarginFraction: '0.2'
                  isOutsideRth: true
                  currentSettlementPrice: '150.25'
                  upperTradingBound: '180.30'
                  lowerTradingBound: '135.23'
                  nextUpperTradingBound: '210.35'
                  nextLowerTradingBound: '120.20'
                  isUpperInExpansionZone: false
                  isLowerInExpansionZone: false
                  upperZoneEnteredAt: null
                  upperExpectedExpansionAt: null
                  lowerZoneEnteredAt: null
                  lowerExpectedExpansionAt: null
                  boundEvent: tradingBoundExpanded
                  boundSide: upper
                  timestamp: 1753822800000000
                  marketSequenceNum: 4211
    UserFillsSnapshot:
      name: UserFillsSnapshot
      title: User Fills Snapshot
      contentType: application/json
      description: Recent fills sent once on subscribe.
      payload:
        $ref: '#/components/schemas/ChannelDataEnvelope'
    UserFillUpdate:
      name: UserFillUpdate
      title: User Fill Update
      contentType: application/json
      description: One fill per frame as orders are matched.
      payload:
        $ref: '#/components/schemas/ChannelDataEnvelope'
    OrdersSnapshot:
      name: OrdersSnapshot
      title: Orders Snapshot
      contentType: application/json
      description: |
        Open orders plus recently closed orders with `isSnapshot: true` and `lastSequenceId` (per-account sequence at snapshot time). Sent once on subscribe.
      payload:
        $ref: '#/components/schemas/ChannelDataEnvelope'
    OrderUpdate:
      name: OrderUpdate
      title: Order Update
      contentType: application/json
      description: |
        One order lifecycle event. Carries `sequenceNumber` (per-account, same counter as AccountUpdate).
      payload:
        $ref: '#/components/schemas/OrderUpdatePayload'
      examples:
        - name: Order fully filled
          payload:
            type: channel_data
            channel: orders
            id: 0xAbCd...1234
            contents:
              orderId: ord-abc123
              clientId: '42'
              marketId: 1
              marketDisplayName: BTC-USD
              side: BUY
              status: FILLED
              price: '94000.00'
              originalSize: '1.0'
              remainingSize: '0.0'
              avgFillPrice: '94000.00'
              state: FILLED
              positionEffect: OPEN_LONG
              sequenceNumber: 5001
        - name: Order rejected
          payload:
            type: channel_data
            channel: orders
            id: 0xAbCd...1234
            contents:
              orderId: ord-xyz789
              marketId: 1
              side: SELL
              status: REJECTED
              state: REJECTED
              rejectionReason: INSUFFICIENT_MARGIN
              sequenceNumber: 5002
    FundingPaymentsSnapshot:
      name: FundingPaymentsSnapshot
      title: Funding Payments Snapshot
      contentType: application/json
      description: |
        Recent funding payments for the account, sent once on subscribe. Same item shape as REST `GET /v1/funding`. Up to 100 entries from the last 30 days; for older history query REST `GET /v1/funding` with `from`.
      payload:
        $ref: '#/components/schemas/FundingPaymentsSnapshotPayload'
      examples:
        - name: Two recent funding payments
          payload:
            type: subscribed
            channel: funding
            id: 0xAbCd...1234
            contents:
              isSnapshot: true
              fundingPayments:
                - marketId: 1
                  marketDisplayName: BTC-USD
                  fundingRate: '0.00001234'
                  size: '0.5'
                  payment: '-3.21'
                  time: 1700000000000000
                - marketId: 2
                  marketDisplayName: ETH-USD
                  fundingRate: '-0.00000567'
                  size: '-2.0'
                  payment: '1.05'
                  time: 1700000000000000
    FundingPaymentUpdate:
      name: FundingPaymentUpdate
      title: Funding Payment Update
      contentType: application/json
      description: |
        One applied funding payment per frame, emitted at each funding payment time. One frame per (market, account) where the position held a non-zero size when the payment was computed.
      payload:
